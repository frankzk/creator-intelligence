<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator Intelligence</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F4F0;--sbg:#fff;--bd:#E5E7EB;--bdl:#F3F4F6;
  --t:#111827;--t2:#374151;--t3:#6B7280;--t4:#9CA3AF;
  --p:#7C3AED;--pl:#EDE9FE;--g:#10B981;--gl:#D1FAE5;
  --b:#3B82F6;--bl:#DBEAFE;--r:#EF4444;--rl:#FEE2E2;
  --a:#F59E0B;--al:#FEF3C7;--o:#F97316;--ol:#FFEDD5;
  --sw:210px;--rad:8px
}
body{display:flex;height:100vh;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--t)}
#sidebar{width:var(--sw);min-width:var(--sw);height:100vh;overflow-y:auto;background:var(--sbg);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding-bottom:16px}
.sb-hdr{padding:16px 14px 12px;border-bottom:1px solid var(--bd)}
.sb-title{font-size:15px;font-weight:700}
.sb-sub{font-size:11px;color:var(--t3);margin-top:2px}
.sb-sec{padding:10px 10px 2px}
.sb-lbl{font-size:10px;font-weight:600;color:var(--t4);letter-spacing:.06em;display:block;padding:0 4px 6px}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:background .15s}
.sb-item:hover{background:var(--bg)}
.sb-item.active{background:#F0EEFB}
.sb-av{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.sb-inf{flex:1;min-width:0}
.sb-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-meta{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:4px;margin-top:1px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}
.dg{background:var(--g)}.da{background:var(--a)}.dr{background:var(--r)}.dgr{background:var(--t4)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.dp{animation:pulse 1.4s ease-in-out infinite}
.sb-ref{width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--t3);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:background .15s}
.sb-ref:hover{background:var(--bg);color:var(--t)}
.sb-add{margin:4px 10px;border:1.5px dashed var(--bd);background:none;border-radius:6px;padding:7px;font-size:12px;color:var(--t3);cursor:pointer;width:calc(100% - 20px);transition:all .15s}
.sb-add:hover{border-color:var(--p);color:var(--p);background:var(--pl)}
.sb-ig{margin:auto 10px 0;padding:9px;background:var(--p);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;width:calc(100% - 20px)}
.sb-ig:hover{background:#6D28D9}
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.view{display:none;flex:1;flex-direction:column}
.view.active{display:flex}
.welcome{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--t3)}
.welcome-ico{font-size:48px;opacity:.25}
.welcome h2{font-size:18px;color:var(--t2);font-weight:600}
.cr-hdr{padding:18px 24px 0;border-bottom:1px solid var(--bd)}
.tabs{display:flex;padding:0 24px;border-bottom:1px solid var(--bd)}
.tab{padding:12px 16px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--t3);transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--t)}
.tab.active{color:var(--p);border-bottom-color:var(--p)}
.tc{flex:1;overflow-y:auto;padding:20px 24px}
.banner{margin:0 24px 16px;padding:10px 14px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--al);border:1px solid #FDE68A}
.banner-t{font-size:13px;font-weight:500;color:#92400E}
.cr-prof{display:flex;align-items:flex-start;gap:12px;padding-bottom:16px}
.cr-av-lg{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.cr-uname{font-size:18px;font-weight:700}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;background:var(--bg);color:var(--t2)}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.mc{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);padding:14px}
.mc-lbl{font-size:11px;color:var(--t3);margin-bottom:6px}
.mc-val{font-size:22px;font-weight:700;line-height:1}
.mc-sub{font-size:11px;color:var(--t3);margin-top:4px}
.dna-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.dna-card{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);padding:16px}
.dna-card h4{font-size:12px;font-weight:600;color:var(--t3);margin-bottom:12px}
.hk-row{margin-bottom:10px}
.hk-txt{font-size:13px;margin-bottom:4px}
.hk-bar-w{height:6px;background:var(--bl);border-radius:3px;overflow:hidden;margin-bottom:2px}
.hk-bar{height:100%;background:var(--p);border-radius:3px}
.hk-pct{font-size:10px;color:var(--t3)}
.ang-wrap{display:flex;flex-wrap:wrap;gap:6px}
.ang-tag{padding:4px 10px;border-radius:20px;font-size:12px;background:var(--bg);color:var(--t2)}
.formula-box{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:var(--rad);padding:16px;margin-bottom:20px}
.formula-lbl{font-size:10px;font-weight:700;color:var(--g);letter-spacing:.08em;margin-bottom:8px}
.formula-txt{font-size:13px;color:var(--t2);margin-bottom:12px;line-height:1.5}
.formula-steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fstep{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;color:#fff}
.farrow{color:var(--t3);font-size:14px}
.vtool{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.vcount{font-size:13px;color:var(--t3)}
.vsort{padding:5px 8px;border:1px solid var(--bd);border-radius:5px;font-size:12px;background:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--rad);overflow:hidden;border:1px solid var(--bd)}
th{padding:9px 14px;font-size:11px;font-weight:600;color:var(--t3);text-align:left;background:var(--bg);border-bottom:1px solid var(--bd)}
td{padding:9px 14px;font-size:13px;border-bottom:1px solid var(--bdl)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAFA}
.hbadge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
.vfoot{margin-top:10px;font-size:12px;color:var(--t3);display:flex;gap:12px}
.lnk{color:var(--p);cursor:pointer;text-decoration:underline}
.sl{display:grid;grid-template-columns:300px 1fr;gap:20px}
.sfp{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);padding:16px;align-self:start}
.sfp h4{font-size:13px;font-weight:600;color:var(--t3);margin-bottom:14px}
.fg{margin-bottom:13px}
.fl{font-size:12px;font-weight:500;color:var(--t2);margin-bottom:4px;display:block}
.fi{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:5px;font-size:13px;outline:none;transition:border .15s}
.fi:focus{border-color:var(--p)}
.upa{border:2px dashed var(--bd);border-radius:6px;padding:18px;text-align:center;cursor:pointer;transition:all .15s;overflow:hidden}
.upa:hover{border-color:var(--p);background:var(--pl)}
.upimg{width:100%;max-height:110px;object-fit:contain;border-radius:4px}
.tg{display:flex;border:1px solid var(--bd);border-radius:5px;overflow:hidden}
.tb{flex:1;padding:7px 4px;border:none;background:#fff;font-size:12px;cursor:pointer;color:var(--t2);transition:all .15s}
.tb.active{background:var(--t);color:#fff;font-weight:600}
.cw{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 10px;border:1px solid var(--bd);border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s;user-select:none;background:#fff}
.chip.sel{background:var(--p);border-color:var(--p);color:#fff}
.gbtn{width:100%;padding:10px;background:var(--t);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:4px}
.gbtn:hover{background:#1F2937}
.gbtn:disabled{background:var(--t3);cursor:not-allowed}
.srp{display:flex;flex-direction:column;gap:0;min-height:400px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--t3);padding:40px;text-align:center}
.empty h3{font-size:16px;color:var(--t2)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:28px;height:28px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}
.scard{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);margin-bottom:16px;overflow:hidden}
.scard-hdr{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.scard-ttl{font-size:14px;font-weight:700;flex:1}
.sdur{padding:3px 8px;background:var(--bg);border-radius:20px;font-size:11px;font-weight:500}
.ssrc{padding:3px 8px;background:var(--pl);color:var(--p);border-radius:20px;font-size:11px;font-weight:500}
.sacts{display:flex;gap:6px;margin-left:auto}
.abtn{padding:5px 10px;border:1px solid var(--bd);background:#fff;border-radius:5px;font-size:12px;cursor:pointer}
.abtn:hover{background:var(--bg)}
.sbody{padding:16px}
.hook-s{background:var(--bg);border-radius:6px;padding:12px;margin-bottom:14px}
.hi{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--bdl)}
.hi:last-child{border-bottom:none}
.hl{font-size:11px;font-weight:600;color:var(--t3);width:50px;flex-shrink:0;padding-top:1px}
.hv{font-size:13px;color:var(--t2);flex:1}
.tbar{display:flex;height:22px;border-radius:4px;overflow:hidden;margin-bottom:14px}
.tseg{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:rgba(255,255,255,.9);overflow:hidden;white-space:nowrap}
.scenes{margin-bottom:14px}
.scene{border-left:3px solid var(--bd);margin-bottom:10px;padding-left:12px}
.sc-hdr{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px;display:flex;gap:8px}
.sc-time{font-weight:400;color:var(--t3)}
.sc-scr{font-size:13px;color:var(--t);margin-bottom:5px;line-height:1.5}
.sc-dir{list-style:none}
.sc-dir li{font-size:12px;color:var(--t3);padding:2px 0;display:flex;gap:6px}
.sc-dir li::before{content:"•";color:var(--t4)}
.desc-w{display:flex;gap:8px;margin-bottom:14px;background:var(--bg);border-radius:6px;padding:10px 12px;align-items:flex-start}
.desc-t{font-size:13px;color:var(--t2);flex:1;line-height:1.5}
.cbtn{padding:4px 8px;border:1px solid var(--bd);background:#fff;border-radius:4px;font-size:11px;cursor:pointer;flex-shrink:0}
.ht-sec{margin-bottom:14px}
.ht-row{display:flex;gap:6px;margin-bottom:5px;align-items:flex-start}
.ht-lbl{font-size:11px;font-weight:600;color:var(--t3);width:50px;flex-shrink:0;padding-top:3px}
.htw{display:flex;flex-wrap:wrap;gap:4px}
.ht{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
.htv{background:var(--bl);color:#1E40AF}
.htp{background:var(--gl);color:#065F46}
.htn{background:var(--pl);color:#5B21B6}
.seo-w{margin-bottom:12px}
.seo-lbl{font-size:11px;font-weight:600;color:var(--t3);margin-bottom:5px}
.seo-mono{font-family:monospace;font-size:11px;color:var(--t2);background:var(--bg);padding:8px 10px;border-radius:5px;line-height:1.6;word-break:break-all}
.seo-chips{display:flex;flex-wrap:wrap;gap:4px}
.seoc{padding:3px 8px;border-radius:20px;font-size:11px;background:var(--bg);color:var(--t2)}
.ph{padding:18px 24px 14px;border-bottom:1px solid var(--bd)}
.pmeta{display:flex;gap:20px;margin-top:10px;flex-wrap:wrap}
.pmi label{font-size:11px;color:var(--t3);display:block;margin-bottom:2px}
.pmi span{font-size:16px;font-weight:700}
.pv-area{padding:18px 24px}
.pvc{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);padding:14px;margin-bottom:10px}
.pvc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pvc-cr{font-size:13px;font-weight:600}
.pvc-st{display:flex;gap:12px;font-size:12px;color:var(--t3)}
.pvc-st b{color:var(--t);font-weight:600}
.pvc-why{font-size:13px;color:var(--t2);line-height:1.5}
.ins-cnt{padding:20px 24px}
.pat-item{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px}
.pat-txt{font-size:13px;color:var(--t2);flex:1}
.pat-crs{display:flex;gap:4px;flex-wrap:wrap}
.pat-cr{padding:3px 8px;background:var(--pl);color:var(--p);border-radius:20px;font-size:11px}
.ins-bul{list-style:none;margin-top:8px}
.ins-bul li{padding:6px 0;font-size:13px;color:var(--t2);display:flex;gap:8px;border-bottom:1px solid var(--bdl)}
.ins-bul li::before{content:"→";color:var(--p)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.mo.h{display:none}
.mc2{background:#fff;border-radius:10px;padding:24px;width:380px;max-width:92vw}
.mt{font-size:16px;font-weight:700;margin-bottom:16px}
.ma{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.bcl{padding:8px 16px;border:1px solid var(--bd);background:#fff;border-radius:5px;font-size:13px;cursor:pointer}
.bok{padding:8px 16px;background:var(--p);color:#fff;border:none;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer}
.bok:hover{background:#6D28D9}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="sb-hdr"><div class="sb-title">Creator Intelligence</div><div class="sb-sub">TikTok Shop &middot; Script Generator</div></div>
  <div class="sb-sec"><span class="sb-lbl">CREADORES</span><div id="cl"></div></div>
  <button class="sb-add" onclick="openModal('c')">+ Agregar creador</button>
  <div class="sb-sec" style="margin-top:8px"><span class="sb-lbl">PRODUCTOS (KALODATA)</span><div id="pl"></div></div>
  <button class="sb-add" onclick="openModal('p')">+ Buscar producto</button>
  <button class="sb-ig" onclick="showInsights()">Insights globales</button>
</aside>
<main id="main">
  <div class="view active" id="view-welcome"><div class="welcome"><div class="welcome-ico">&#10022;</div><h2>Creator Intelligence</h2><p>Agrega un creador o busca un producto para comenzar</p></div></div>
  <div class="view" id="view-creator">
    <div id="cr-banner"></div>
    <div class="cr-hdr" id="cr-hdr"></div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="adn" onclick="switchTab('adn')">ADN del creador</div>
      <div class="tab" data-tab="videos" onclick="switchTab('videos')">Videos</div>
      <div class="tab" data-tab="script" onclick="switchTab('script')">Generar script</div>
    </div>
    <div class="tc" id="tc"></div>
  </div>
  <div class="view" id="view-product"><div class="ph" id="ph"></div><div class="pv-area" id="pva"></div></div>
  <div class="view" id="view-insights"><div class="ins-cnt" id="ic"><div class="empty"><div class="spin"></div></div></div></div>
</main>
<div class="mo h" id="mo" onclick="closeMo(event)">
  <div class="mc2" onclick="event.stopPropagation()">
    <div class="mt" id="mo-t"></div>
    <div id="mo-b"></div>
    <div class="ma"><button class="bcl" onclick="closeMo()">Cancelar</button><button class="bok" id="mo-ok">OK</button></div>
  </div>
</div>
<script>
const S={
  creators:[],products:[],
  cid:null,pid:null,
  view:'welcome',tab:'adn',
  det:null,pdet:null,
  vids:{list:[],total:0,page:1,sort:'views',pp:10},
  scripts:[],gen:false,
  form:{name:'',benefit:'',mode:'multicreador',cids:[],pids:[],qty:3,imgf:null,imgu:null},
  polls:{}
};

const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtN(n){n=Number(n)||0;if(n>=1e6)return(n/1e6).toFixed(1).replace('.0','')+'M';if(n>=1e3)return Math.round(n/1e3)+'K';return String(n);}
function fmtD(ts){if(!ts)return'--';const d=new Date(ts.includes('T')?ts:ts+' UTC');const s=Math.round((Date.now()-d)/1000);if(s<60)return'hace un momento';if(s<3600)return`hace ${Math.round(s/60)}m`;if(s<86400)return`hace ${Math.round(s/3600)}h`;return`hace ${Math.round(s/86400)}d`;}
const COLS=['#7C3AED','#059669','#2563EB','#DC2626','#D97706','#0891B2','#DB2777','#9333EA'];
function avcol(i){return COLS[i%COLS.length];}
function inits(n){return String(n||'').slice(0,2).toUpperCase();}
function hkCol(h){const m={'Dato shock':['#EDE9FE','#5B21B6'],'Contraste':['#FFEDD5','#C2410C'],'Directo':['#D1FAE5','#065F46'],'Testimonio':['#DBEAFE','#1E40AF'],'Comparacion':['#FEF3C7','#92400E']};return m[h]||['#F3F4F6','#374151'];}
function scCol(l){const m={Hook:'#7C3AED',Dolor:'#EF4444',Descubrimiento:'#3B82F6',Prueba:'#10B981',CTA:'#F59E0B'};return m[l]||'#6B7280';}
function parseDur(t){const m=String(t||'').match(/(\d+)\D+(\d+)/);return m?+m[2]-+m[1]:0;}

async function api(method,path,body){
  const o={method,headers:{}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
  const r=await fetch(path,o);
  if(!r.ok){const e=await r.json().catch(()=>({detail:r.statusText}));throw new Error(e.detail||'Error');}
  return r.json();
}

async function loadAll(){
  const [creators,products]=await Promise.all([api('GET','/api/creators'),api('GET','/api/products')]);
  S.creators=creators;S.products=products;
  renderSB();
  [...creators,...products].forEach(x=>{
    if(x.status&&!['done','error'].includes(x.status)) startPoll(x.id,!!x.username);
  });
}

function renderSB(){
  $('cl').innerHTML=S.creators.map((c,i)=>{
    const dc=c.status==='done'?'dg':c.status==='error'?'dr':'da dp';
    const meta=c.status==='done'?`${c.video_count||0} videos`:c.niche||c.status||'...';
    return`<div class="sb-item${S.cid===c.id?' active':''}" onclick="selC(${c.id})">
      <div class="sb-av" style="background:${avcol(i)}">${inits(c.display_name||c.username)}</div>
      <div class="sb-inf"><div class="sb-name">${esc(c.display_name||c.username)}</div>
      <div class="sb-meta"><span class="dot ${dc}"></span>${esc(meta)}</div></div>
      <button class="sb-ref" onclick="event.stopPropagation();refC(${c.id})" title="Actualizar">&#8635;</button>
    </div>`;
  }).join('');
  $('pl').innerHTML=S.products.map((p,i)=>{
    const dc=p.status==='done'?'dg':p.status==='error'?'dr':'da dp';
    const meta=p.status==='done'?`${p.total_videos||0} videos`:p.status||'...';
    return`<div class="sb-item${S.pid===p.id?' active':''}" onclick="selP(${p.id})">
      <div class="sb-av" style="background:${avcol(i+4)}">${inits(p.keyword)}</div>
      <div class="sb-inf"><div class="sb-name">${esc(p.keyword)}</div>
      <div class="sb-meta"><span class="dot ${dc}"></span>${esc(meta)}</div></div>
    </div>`;
  }).join('');
}

function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(`view-${v}`).classList.add('active');S.view=v;}
function switchTab(t){S.tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));renderTC();}

async function selC(id){
  S.cid=id;S.pid=null;S.scripts=[];renderSB();showView('creator');
  try{S.det=await api('GET',`/api/creators/${id}`);renderCrHdr();renderBanner();renderTC();if(!['done','error'].includes(S.det.status))startPoll(id,true);}
  catch(e){$('tc').innerHTML=`<div class="empty"><p style="color:var(--r)">${esc(e.message)}</p></div>`;}
}

function renderCrHdr(){
  const c=S.det;if(!c)return;
  const i=S.creators.findIndex(x=>x.id===c.id);
  $('cr-hdr').innerHTML=`<div class="cr-prof">
    <div class="cr-av-lg" style="background:${avcol(i>=0?i:0)}">${inits(c.display_name||c.username)}</div>
    <div><div class="cr-uname">@${esc(c.username)}</div>
    <div class="badges">
      ${c.niche&&c.niche.length<30?`<span class="badge">${esc(c.niche)}</span>`:''}
      <span class="badge">${c.video_count||0} videos</span>
      ${c.last_scraped?`<span class="badge">Actualizado ${fmtD(c.last_scraped)}</span>`:''}
    </div></div></div>`;
  document.querySelector('[data-tab="videos"]').textContent=`Videos (${c.video_count||0})`;
}

function renderBanner(){
  const c=S.det;const b=$('cr-banner');
  if(!c||['done','error'].includes(c.status)){b.innerHTML='';return;}
  b.innerHTML=`<div class="banner"><div style="display:flex;align-items:center;gap:8px"><div class="spin" style="width:16px;height:16px;border-width:2px"></div><span class="banner-t">${esc(c.niche||c.status||'Analizando...')}</span></div></div>`;
}

function renderTC(){if(!S.det)return;if(S.tab==='adn')renderADN();else if(S.tab==='videos')loadVids();else renderScriptForm();}

function renderADN(){
  const c=S.det,a=c.analysis||{};
  const hooks=a.top_hooks||[],angles=a.angles||[],steps=a.formula_steps||[];
  const mg=`<div class="mg">
    <div class="mc"><div class="mc-lbl">Promedio views</div><div class="mc-val">${fmtN(a.avg_views||0)}</div><div class="mc-sub">por video</div></div>
    <div class="mc"><div class="mc-lbl">Videos +1M</div><div class="mc-val">${c.videos_1m||0}</div><div class="mc-sub">de ${c.video_count||0}</div></div>
    <div class="mc"><div class="mc-lbl">Duraci&oacute;n top</div><div class="mc-val">${a.avg_duration||'--'}<small style="font-size:13px">s</small></div><div class="mc-sub">promedio</div></div>
    <div class="mc"><div class="mc-lbl">Hook dominante</div><div class="mc-val" style="font-size:15px">${esc(a.dominant_hook||'--')}</div></div>
  </div>`;
  const hh=hooks.map(h=>{
    const exLink=h.example_url
      ?`<a href="${esc(h.example_url)}" target="_blank" style="font-size:10px;color:var(--p);text-decoration:none;margin-left:6px">&#9654; ver ejemplo</a>`
      :'';
    return`<div class="hk-row"><div class="hk-txt">"${esc(h.text)}"</div><div class="hk-bar-w"><div class="hk-bar" style="width:${h.performance_pct||0}%"></div></div><div class="hk-pct">${h.performance_pct||0}% &middot; ${h.count||0} videos${exLink}</div></div>`;
  }).join('');
  const ah=angles.map(a=>`<span class="ang-tag">${esc(a)}</span>`).join('');
  const sh=steps.map((s,i)=>`${i>0?'<span class="farrow">&rarr;</span>':''}<span class="fstep" style="background:${s.color||'#6B7280'}">${esc(s.label)}</span>`).join('');
  const dna=hooks.length?`<div class="dna-grid">
    <div class="dna-card"><h4>Hooks m&aacute;s efectivos (por performance)</h4>${hh||'<span style="color:var(--t3)">Sin datos</span>'}</div>
    <div class="dna-card"><h4>&Aacute;ngulos de producto que convierten</h4><div class="ang-wrap">${ah||'<span style="color:var(--t3)">Sin datos</span>'}</div></div>
  </div>`:'';
  const fml=a.formula?`<div class="formula-box"><div class="formula-lbl">&bull; F&Oacute;RMULA DEL CREADOR</div><div class="formula-txt">${esc(a.formula)}</div><div class="formula-steps">${sh}</div></div>`:'';
  const none=!a.formula&&!hooks.length?`<div style="padding:28px;text-align:center;color:var(--t3)">${c.status==='done'?'No hay an&aacute;lisis disponible.':'An&aacute;lisis en progreso...'}</div>`:'';
  $('tc').innerHTML=mg+dna+fml+none;
}

async function loadVids(page){
  page=page||S.vids.page;
  try{
    const d=await api('GET',`/api/creators/${S.cid}/videos?sort=${S.vids.sort}&page=${page}&per_page=${S.vids.pp}`);
    S.vids={...S.vids,...d,list:d.videos,page};renderVids();
  }catch(e){$('tc').innerHTML=`<p style="color:var(--r);padding:20px">${esc(e.message)}</p>`;}
}

function renderVids(){
  const{list,total,page,pp,sort}=S.vids;
  const rows=list.map(v=>{
    const[bg,fg]=hkCol(v.hook_type);
    const thumb=v.thumbnail
      ?`<img src="${esc(v.thumbnail)}" style="width:48px;height:64px;object-fit:cover;border-radius:4px" loading="lazy">`
      :`<div style="width:48px;height:64px;background:var(--bg);border-radius:4px;border:1px solid var(--bd)"></div>`;
    const titleCell=v.url
      ?`<a href="${esc(v.url)}" target="_blank" style="color:var(--t);text-decoration:none" title="${esc(v.title)}">${esc((v.title||'').slice(0,40))}${(v.title||'').length>40?'&hellip;':''}</a>`
      :`${esc((v.title||'').slice(0,40))}`;
    const date=v.published_at?v.published_at.slice(0,10):'--';
    const tags=(v.hashtags||'').split(' ').filter(Boolean).slice(0,3)
      .map(t=>`<span style="font-size:10px;background:var(--pl);color:var(--p);padding:2px 5px;border-radius:10px">${esc(t)}</span>`).join(' ');
    return`<tr>
      <td style="padding:6px 8px">${thumb}</td>
      <td style="max-width:180px">${titleCell}</td>
      <td style="color:var(--t3);white-space:nowrap;font-size:12px">${date}</td>
      <td style="font-weight:600">${fmtN(v.views)}</td>
      <td style="font-size:12px;color:var(--t3);white-space:nowrap">${fmtN(v.likes||0)} &#10084; ${fmtN(v.comments||0)} &#128172;</td>
      <td><span class="hbadge" style="background:${bg};color:${fg}">${esc(v.hook_type||'--')}</span></td>
      <td style="font-size:11px">${tags}</td>
      <td>${v.duration||0}s</td>
    </tr>`;
  }).join('');
  const shown=Math.min(page*pp,total);
  $('tc').innerHTML=`<div class="vtool">
    <span class="vcount">${total} videos &middot; ordenados por ${sort==='views'?'views':sort==='hook_type'?'hook':sort==='published_at'?'fecha':'duraci&oacute;n'}</span>
    <select class="vsort" onchange="S.vids.sort=this.value;loadVids(1)">
      <option value="views"${sort==='views'?' selected':''}>Ordenar: Views</option>
      <option value="published_at"${sort==='published_at'?' selected':''}>Ordenar: Fecha</option>
      <option value="hook_type"${sort==='hook_type'?' selected':''}>Ordenar: Hook type</option>
      <option value="duration"${sort==='duration'?' selected':''}>Ordenar: Duraci&oacute;n</option>
    </select></div>
  <table><thead><tr><th></th><th>Video</th><th>Fecha</th><th>Views</th><th>Likes / Coment.</th><th>Hook</th><th>Hashtags</th><th>Dur.</th></tr></thead>
  <tbody>${rows||'<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--t3)">Sin videos</td></tr>'}</tbody></table>
  <div class="vfoot"><span>Mostrando ${shown} de ${total}</span>
    ${page>1?`<span class="lnk" onclick="loadVids(${page-1})">&larr; ant</span>`:''}
    ${shown<total?`<span class="lnk" onclick="loadVids(${page+1})">sig &rarr;</span>`:''}
    ${total>pp?`<span class="lnk" onclick="S.vids.pp=100;loadVids(1)">ver todos</span>`:''}
  </div>`;
}

function startPoll(id,isC){
  const k=`${isC?'c':'p'}_${id}`;if(S.polls[k])return;
  S.polls[k]=setInterval(async()=>{
    try{
      const d=await api('GET',isC?`/api/creators/${id}`:`/api/products/${id}`);
      const done=['done','error'].includes(d.status);
      if(isC){const i=S.creators.findIndex(x=>x.id===id);if(i>=0)S.creators[i]={...S.creators[i],...d};}
      else{const i=S.products.findIndex(x=>x.id===id);if(i>=0)S.products[i]={...S.products[i],...d};}
      renderSB();
      if(isC&&S.cid===id){S.det=d;renderCrHdr();renderBanner();if(done&&S.tab==='adn')renderADN();}
      if(!isC&&S.pid===id){S.pdet=d;renderProd(d);}
      if(done){clearInterval(S.polls[k]);delete S.polls[k];}
    }catch{clearInterval(S.polls[k]);delete S.polls[k];}
  },3000);
}

async function refC(id){
  try{await api('POST',`/api/creators/${id}/refresh`);const i=S.creators.findIndex(c=>c.id===id);if(i>=0)S.creators[i].status='scraping';renderSB();if(S.cid===id)await selC(id);else startPoll(id,true);}
  catch(e){alert(e.message);}
}

function togChip(type,id){
  const f=S.form;
  if(type==='c'){if(f.mode==='un_creador')f.cids=[id];else f.cids=f.cids.includes(id)?f.cids.filter(x=>x!==id):[...f.cids,id];}
  else f.pids=f.pids.includes(id)?f.pids.filter(x=>x!==id):[...f.pids,id];
  renderScriptForm();
}
function setMode(m){
  S.form.mode=m;
  if(m==='mejor_de_todos'){S.form.cids=S.creators.map(c=>c.id);S.form.pids=S.products.map(p=>p.id);}
  else if(m==='un_creador'&&S.form.cids.length>1)S.form.cids=[S.form.cids[0]];
  renderScriptForm();
}
async function doUpload(e){
  const file=e.target.files[0];if(!file)return;
  const fd=new FormData();fd.append('file',file);
  try{const r=await fetch('/api/upload',{method:'POST',body:fd});const d=await r.json();S.form.imgf=d.filename;S.form.imgu=d.url;renderScriptForm();}
  catch(err){alert('Error subiendo imagen: '+err.message);}
}
async function doGenerate(){
  const f=S.form;if(!f.name.trim()){alert('Ingresa el nombre del producto');return;}
  S.gen=true;S.scripts=[];renderScriptForm();
  try{const d=await api('POST','/api/scripts/generate',{product_name:f.name,benefit:f.benefit,mode:f.mode,creator_ids:f.cids,product_ids:f.pids,quantity:f.qty,image_filename:f.imgf});S.scripts=d.scripts||[];}
  catch(e){alert('Error: '+e.message);}
  S.gen=false;renderScriptForm();
}

function mkCard(s,i){
  const scenes=s.scenes||[];
  const total=scenes.reduce((sum,sc)=>sum+parseDur(sc.timing),0)||scenes.length*8;
  const tbar=scenes.map(sc=>{const pct=Math.round(parseDur(sc.timing)/total*100);const c=scCol(sc.label);return`<div class="tseg" style="width:${pct}%;background:${c}" title="${esc(sc.label)}">${pct>12?esc(sc.label):''}</div>`;}).join('');
  const scns=scenes.map(sc=>{const c=scCol(sc.label);return`<div class="scene" style="border-left-color:${c}"><div class="sc-hdr">${esc(sc.label)}<span class="sc-time">${esc(sc.timing)}</span></div><div class="sc-scr">${esc(sc.script)}</div><ul class="sc-dir">${(sc.direction||[]).map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`;}).join('');
  const ht=s.hashtags||{};
  const htH=`<div class="ht-sec">
    <div class="ht-row"><span class="ht-lbl">Viral</span><div class="htw">${(ht.viral||[]).map(h=>`<span class="ht htv">${esc(h)}</span>`).join('')}</div></div>
    <div class="ht-row"><span class="ht-lbl">Producto</span><div class="htw">${(ht.product||[]).map(h=>`<span class="ht htp">${esc(h)}</span>`).join('')}</div></div>
    <div class="ht-row"><span class="ht-lbl">Nicho</span><div class="htw">${(ht.niche||[]).map(h=>`<span class="ht htn">${esc(h)}</span>`).join('')}</div></div>
  </div>`;
  return`<div class="scard">
    <div class="scard-hdr">
      <div class="scard-ttl">${esc(s.title)}</div>
      <span class="sdur">${esc(s.duration_estimate)}</span>
      <span class="ssrc">${esc(s.source)}</span>
      <div class="sacts"><button class="abtn" onclick="cpScript(${i})">&#128203; Copiar</button><button class="abtn" onclick="dlScript(${i})">&#8595; .txt</button></div>
    </div>
    <div class="sbody">
      <div class="hook-s">
        <div class="hi"><span class="hl">Visual</span><span class="hv">${esc(s.hook?.visual||'')}</span></div>
        <div class="hi"><span class="hl">Textual</span><span class="hv">${esc(s.hook?.textual||'')}</span></div>
        <div class="hi"><span class="hl">Audio</span><span class="hv">${esc(s.hook?.audio||'')}</span></div>
      </div>
      <div class="tbar">${tbar}</div>
      <div class="scenes">${scns}</div>
      <div class="desc-w"><span class="desc-t">${esc(s.description||'')}</span><button class="cbtn" onclick="cpTxt('${esc(s.description||'')}',this)">Copiar</button></div>
      ${htH}
      <div class="seo-w"><div class="seo-lbl">SEO texto oculto <span style="font-weight:400;color:var(--t3)">(pegar al final con color fondo)</span></div><div class="seo-mono">${(s.seo_hidden||[]).join(' &middot; ')}</div></div>
      <div class="seo-w"><div class="seo-lbl">SEO audio &mdash; di en voz alta</div><div class="seo-chips">${(s.seo_audio||[]).map(w=>`<span class="seoc">${esc(w)}</span>`).join('')}</div></div>
    </div>
  </div>`;
}

function buildTxt(s){
  const sep='=====================================';
  const sec=l=>`\n-- ${l} ${'--'.repeat(Math.max(0,17-l.length))}\n`;
  let t=`${sep}\n${s.title} - ${S.form.name}\n${s.duration_estimate} - ${s.source}\n${sep}`;
  t+=sec('HOOK');t+=`VISUAL: ${s.hook?.visual||''}\nTEXTUAL: ${s.hook?.textual||''}\nAUDIO: ${s.hook?.audio||''}`;
  t+=sec('SCRIPT');
  (s.scenes||[]).forEach(sc=>{t+=`\n${sc.label} (${sc.timing})\nGUION: ${sc.script}\nDIRECCION:\n`;(sc.direction||[]).forEach(d=>{t+=`  - ${d}\n`;});});
  t+=sec('DESCRIPCION');t+=s.description||'';
  t+=sec('HASHTAGS');const ht=s.hashtags||{};t+=[...(ht.viral||[]),...(ht.product||[]),...(ht.niche||[])].join(' ');
  t+=sec('SEO TEXTO OCULTO');t+='(Pegar al final con texto color fondo)\n'+(s.seo_hidden||[]).join(' ');
  t+=sec('SEO AUDIO (DI EN VOZ ALTA)');t+=(s.seo_audio||[]).join(' - ');
  return t;
}
function cpScript(i){const s=S.scripts[i];if(s)cpTxt(buildTxt(s));}
function dlScript(i){
  const s=S.scripts[i];if(!s)return;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buildTxt(s)],{type:'text/plain'}));
  a.download=`script-${i+1}.txt`;a.click();URL.revokeObjectURL(a.href);
}
function cpTxt(txt,btn){
  navigator.clipboard.writeText(txt).then(()=>{if(btn){const o=btn.textContent;btn.textContent='OK';setTimeout(()=>btn.textContent=o,1500);}}).catch(()=>alert('No se pudo copiar'));
}

  const ins=(d.insights||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  $('ic').innerHTML=`<div style="font-size:18px;font-weight:700;margin-bottom:4px">Insights globales</div>
    <div style="font-size:13px;color:var(--t3);margin-bottom:18px">Patrones detectados en todos los creadores</div>
    <div class="mg">
      <div class="mc"><div class="mc-lbl">Videos analizados</div><div class="mc-val">${d.total_videos_analyzed||0}</div></div>
      <div class="mc"><div class="mc-lbl">Avg views global</div><div class="mc-val">${fmtN(d.avg_views_all||0)}</div></div>
      <div class="mc"><div class="mc-lbl">Hook dominante</div><div class="mc-val" style="font-size:15px">${esc(d.dominant_hook||'--')}</div></div>
      <div class="mc"><div class="mc-lbl">Duracion ideal</div><div class="mc-val" style="font-size:15px">${esc(d.best_duration||'--')}</div></div>
    </div>
    ${pats?`<div style="font-size:13px;font-weight:600;color:var(--t3);margin-bottom:10px">PATRONES DETECTADOS</div>${pats}`:'<p style="color:var(--t3)">Agrega mas creadores para detectar patrones.</p>'}
    ${angs?`<div style="margin-top:16px"><div style="font-size:13px;font-weight:600;color:var(--t3);margin-bottom:8px">TOP ANGULOS</div><div class="ang-wrap">${angs}</div></div>`:''}
    ${ins?`<div style="margin-top:16px"><div style="font-size:13px;font-weight:600;color:var(--t3);margin-bottom:8px">INSIGHTS</div><ul class="ins-bul">${ins}</ul></div>`:''}`;  
}

function openModal(type){
  $('mo').classList.remove('h');
  if(type==='c'){
    $('mo-t').textContent='Agregar creador';
    $('mo-b').innerHTML=`<div class="fg"><label class="fl">URL del perfil TikTok *</label><input class="fi" id="m-url" placeholder="https://www.tiktok.com/@username" autofocus></div><div class="fg"><label class="fl">Nombre display (opcional)</label><input class="fi" id="m-name" placeholder="ej. Una Flor Cubana"></div>`;
    $('mo-ok').textContent='Agregar y analizar';$('mo-ok').onclick=subCreator;
  } else {
    $('mo-t').textContent='Buscar producto en Kalodata';
    $('mo-b').innerHTML=`<div class="fg"><label class="fl">Keyword del producto *</label><input class="fi" id="m-kw" placeholder="ej. rosemary shampoo" autofocus></div>`;
    $('mo-ok').textContent='Buscar y analizar';$('mo-ok').onclick=subProduct;
  }
  setTimeout(()=>document.querySelector('#mo-b .fi')?.focus(),50);
}
function closeMo(e){if(!e||e.target===$('mo'))$('mo').classList.add('h');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('mo').classList.add('h');});

async function subCreator(){
  const url=$('m-url')?.value?.trim();const name=$('m-name')?.value?.trim();
  if(!url){alert('Ingresa la URL del perfil');return;}
  const btn=$('mo-ok');btn.disabled=true;btn.textContent='Agregando...';
  try{
    const d=await api('POST','/api/creators',{url,display_name:name});
    S.creators.unshift({id:d.id,username:d.username,display_name:name||d.username,status:'scraping',video_count:0,niche:'Extrayendo...'});
    renderSB();$('mo').classList.add('h');startPoll(d.id,true);selC(d.id);
  }catch(e){alert(e.message);btn.disabled=false;btn.textContent='Agregar y analizar';}
}
async function subProduct(){
  const kw=$('m-kw')?.value?.trim();if(!kw){alert('Ingresa una keyword');return;}
  const btn=$('mo-ok');btn.disabled=true;btn.textContent='Buscando...';
  try{
    const d=await api('POST','/api/products/search',{keyword:kw});
    S.products.unshift({id:d.id,keyword:kw,status:'scraping',total_videos:0});
    renderSB();$('mo').classList.add('h');startPoll(d.id,false);selP(d.id);
  }catch(e){alert(e.message);btn.disabled=false;btn.textContent='Buscar y analizar';}
}

loadAll();
</script>
</body>
