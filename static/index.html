<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator Intelligence</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F4F0;--sbg:#fff;--bd:#E5E7EB;--bdl:#F3F4F6;
  --t:#111827;--t2:#374151;--t3:#6B7280;--t4:#9CA3AF;
  --p:#7C3AED;--pl:#EDE9FE;--g:#10B981;--gl:#D1FAE5;
  --b:#3B82F6;--bl:#DBEAFE;--r:#EF4444;--rl:#FEE2E2;
  --a:#F59E0B;--al:#FEF3C7;--o:#F97316;--ol:#FFEDD5;
  --sw:210px;--rad:8px
}
body{display:flex;height:100vh;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--t)}
/* ── Sidebar ── */
#sidebar{width:var(--sw);min-width:var(--sw);height:100vh;overflow-y:auto;background:var(--sbg);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding-bottom:16px}
.sb-hdr{padding:16px 14px 12px;border-bottom:1px solid var(--bd)}
.sb-title{font-size:15px;font-weight:700}
.sb-sub{font-size:11px;color:var(--t3);margin-top:2px}
.sb-sec{padding:10px 10px 2px}
.sb-lbl{font-size:10px;font-weight:600;color:var(--t4);letter-spacing:.06em;display:block;padding:0 4px 6px}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:background .15s}
.sb-item:hover{background:var(--bg)}
.sb-item.active{background:#F0EEFB}
.sb-av{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.sb-inf{flex:1;min-width:0}
.sb-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-meta{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:4px;margin-top:1px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}
.dg{background:var(--g)}.da{background:var(--a)}.dr{background:var(--r)}.dgr{background:var(--t4)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.dp{animation:pulse 1.4s ease-in-out infinite}
.sb-ref{width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--t3);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:background .15s}
.sb-ref:hover{background:var(--bg);color:var(--t)}
.sb-add{margin:4px 10px;border:1.5px dashed var(--bd);background:none;border-radius:6px;padding:7px;font-size:12px;color:var(--t3);cursor:pointer;width:calc(100% - 20px);transition:all .15s}
.sb-add:hover{border-color:var(--p);color:var(--p);background:var(--pl)}
.sb-ig{margin:auto 10px 0;padding:9px;background:var(--p);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;width:calc(100% - 20px)}
.sb-ig:hover{background:#6D28D9}
/* ── Main ── */
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.view{display:none;flex:1;flex-direction:column}
.view.active{display:flex}
/* Welcome */
.welcome{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--t3)}
.welcome-ico{font-size:48px;opacity:.25}
.welcome h2{font-size:18px;color:var(--t2);font-weight:600}
/* Tabs */
.cr-hdr{padding:18px 24px 0;border-bottom:1px solid var(--bd)}
.tabs{display:flex;padding:0 24px;border-bottom:1px solid var(--bd)}
.tab{padding:12px 16px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--t3);transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--t)}
.tab.active{color:var(--p);border-bottom-color:var(--p)}
.tc{flex:1;overflow-y:auto;padding:20px 24px}
/* Banner */
.banner{margin:0 24px 16px;padding:10px 14px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--al);border:1px solid #FDE68A}
.banner-t{font-size:13px;font-weight:500;color:#92400E}
/* Creator profile */
.cr-prof{display:flex;align-items:flex-start;gap:12px;padding-bottom:16px}
.cr-av-lg{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.cr-uname{font-size:18px;font-weight:700}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;background:var(--bg);color:var(--t2)}
/* Metrics */
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.mc{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);padding:14px}
.mc-lbl{font-size:11px;color:var(--t3);margin-bottom:6px}
.mc-val{font-size:22px;font-weight:700;line-height:1}
.mc-sub{font-size:11px;color:var(--t3);margin-top:4px}
/* DNA */
.dna-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.dna-card{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);padding:16px}
.dna-card h4{font-size:12px;font-weight:600;color:var(--t3);margin-bottom:12px}
.hk-row{margin-bottom:10px}
.hk-txt{font-size:13px;margin-bottom:4px}
.hk-bar-w{height:6px;background:var(--bl);border-radius:3px;overflow:hidden;margin-bottom:2px}
.hk-bar{height:100%;background:var(--p);border-radius:3px}
.hk-pct{font-size:10px;color:var(--t3)}
.ang-wrap{display:flex;flex-wrap:wrap;gap:6px}
.ang-tag{padding:4px 10px;border-radius:20px;font-size:12px;background:var(--bg);color:var(--t2)}
/* Formula */
.formula-box{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:var(--rad);padding:16px;margin-bottom:20px}
.formula-lbl{font-size:10px;font-weight:700;color:var(--g);letter-spacing:.08em;margin-bottom:8px}
.formula-txt{font-size:13px;color:var(--t2);margin-bottom:12px;line-height:1.5}
.formula-steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fstep{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;color:#fff}
.farrow{color:var(--t3);font-size:14px}
/* Table */
.vtool{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.vcount{font-size:13px;color:var(--t3)}
.vsort{padding:5px 8px;border:1px solid var(--bd);border-radius:5px;font-size:12px;background:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--rad);overflow:hidden;border:1px solid var(--bd)}
th{padding:9px 14px;font-size:11px;font-weight:600;color:var(--t3);text-align:left;background:var(--bg);border-bottom:1px solid var(--bd)}
td{padding:9px 14px;font-size:13px;border-bottom:1px solid var(--bdl)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAFA}
.hbadge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
.vfoot{margin-top:10px;font-size:12px;color:var(--t3);display:flex;gap:12px}
.lnk{color:var(--p);cursor:pointer;text-decoration:underline}
/* Script form */
.sl{display:grid;grid-template-columns:300px 1fr;gap:20px}
.sfp{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);padding:16px;align-self:start}
.sfp h4{font-size:13px;font-weight:600;color:var(--t3);margin-bottom:14px}
.fg{margin-bottom:13px}
.fl{font-size:12px;font-weight:500;color:var(--t2);margin-bottom:4px;display:block}
.fi{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:5px;font-size:13px;outline:none;transition:border .15s}
.fi:focus{border-color:var(--p)}
.upa{border:2px dashed var(--bd);border-radius:6px;padding:18px;text-align:center;cursor:pointer;transition:all .15s;overflow:hidden}
.upa:hover{border-color:var(--p);background:var(--pl)}
.upimg{width:100%;max-height:110px;object-fit:contain;border-radius:4px}
.tg{display:flex;border:1px solid var(--bd);border-radius:5px;overflow:hidden}
.tb{flex:1;padding:7px 4px;border:none;background:#fff;font-size:12px;cursor:pointer;color:var(--t2);transition:all .15s}
.tb.active{background:var(--t);color:#fff;font-weight:600}
.cw{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 10px;border:1px solid var(--bd);border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s;user-select:none;background:#fff}
.chip.sel{background:var(--p);border-color:var(--p);color:#fff}
.gbtn{width:100%;padding:10px;background:var(--t);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:4px}
.gbtn:hover{background:#1F2937}
.gbtn:disabled{background:var(--t3);cursor:not-allowed}
/* Script results */
.srp{display:flex;flex-direction:column;gap:0;min-height:400px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--t3);padding:40px;text-align:center}
.empty h3{font-size:16px;color:var(--t2)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:28px;height:28px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}
/* Script card */
.scard{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);margin-bottom:16px;overflow:hidden}
.scard-hdr{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.scard-ttl{font-size:14px;font-weight:700;flex:1}
.sdur{padding:3px 8px;background:var(--bg);border-radius:20px;font-size:11px;font-weight:500}
.ssrc{padding:3px 8px;background:var(--pl);color:var(--p);border-radius:20px;font-size:11px;font-weight:500}
.sacts{display:flex;gap:6px;margin-left:auto}
.abtn{padding:5px 10px;border:1px solid var(--bd);background:#fff;border-radius:5px;font-size:12px;cursor:pointer}
.abtn:hover{background:var(--bg)}
.sbody{padding:16px}
.hook-s{background:var(--bg);border-radius:6px;padding:12px;margin-bottom:14px}
.hi{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--bdl)}
.hi:last-child{border-bottom:none}
.hl{font-size:11px;font-weight:600;color:var(--t3);width:50px;flex-shrink:0;padding-top:1px}
.hv{font-size:13px;color:var(--t2);flex:1}
.tbar{display:flex;height:22px;border-radius:4px;overflow:hidden;margin-bottom:14px}
.tseg{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:rgba(255,255,255,.9);overflow:hidden;white-space:nowrap}
.scenes{margin-bottom:14px}
.scene{border-left:3px solid var(--bd);margin-bottom:10px;padding-left:12px}
.sc-hdr{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px;display:flex;gap:8px}
.sc-time{font-weight:400;color:var(--t3)}
.sc-scr{font-size:13px;color:var(--t);margin-bottom:5px;line-height:1.5}
.sc-dir{list-style:none}
.sc-dir li{font-size:12px;color:var(--t3);padding:2px 0;display:flex;gap:6px}
.sc-dir li::before{content:"•";color:var(--t4)}
.desc-w{display:flex;gap:8px;margin-bottom:14px;background:var(--bg);border-radius:6px;padding:10px 12px;align-items:flex-start}
.desc-t{font-size:13px;color:var(--t2);flex:1;line-height:1.5}
.cbtn{padding:4px 8px;border:1px solid var(--bd);background:#fff;border-radius:4px;font-size:11px;cursor:pointer;flex-shrink:0}
.ht-sec{margin-bottom:14px}
.ht-row{display:flex;gap:6px;margin-bottom:5px;align-items:flex-start}
.ht-lbl{font-size:11px;font-weight:600;color:var(--t3);width:50px;flex-shrink:0;padding-top:3px}
.htw{display:flex;flex-wrap:wrap;gap:4px}
.ht{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
.htv{background:var(--bl);color:#1E40AF}
.htp{background:var(--gl);color:#065F46}
.htn{background:var(--pl);color:#5B21B6}
.seo-w{margin-bottom:12px}
.seo-lbl{font-size:11px;font-weight:600;color:var(--t3);margin-bottom:5px}
.seo-mono{font-family:monospace;font-size:11px;color:var(--t2);background:var(--bg);padding:8px 10px;border-radius:5px;line-height:1.6;word-break:break-all}
.seo-chips{display:flex;flex-wrap:wrap;gap:4px}
.seoc{padding:3px 8px;border-radius:20px;font-size:11px;background:var(--bg);color:var(--t2)}
/* Product */
.ph{padding:18px 24px 14px;border-bottom:1px solid var(--bd)}
.pmeta{display:flex;gap:20px;margin-top:10px;flex-wrap:wrap}
.pmi label{font-size:11px;color:var(--t3);display:block;margin-bottom:2px}
.pmi span{font-size:16px;font-weight:700}
.pv-area{padding:18px 24px}
.pvc{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);padding:14px;margin-bottom:10px}
.pvc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pvc-cr{font-size:13px;font-weight:600}
.pvc-st{display:flex;gap:12px;font-size:12px;color:var(--t3)}
.pvc-st b{color:var(--t);font-weight:600}
.pvc-why{font-size:13px;color:var(--t2);line-height:1.5}
/* Insights */
.ins-cnt{padding:20px 24px}
.pat-item{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px}
.pat-txt{font-size:13px;color:var(--t2);flex:1}
.pat-crs{display:flex;gap:4px;flex-wrap:wrap}
.pat-cr{padding:3px 8px;background:var(--pl);color:var(--p);border-radius:20px;font-size:11px}
.ins-bul{list-style:none;margin-top:8px}
.ins-bul li{padding:6px 0;font-size:13px;color:var(--t2);display:flex;gap:8px;border-bottom:1px solid var(--bdl)}
.ins-bul li::before{content:"→";color:var(--p)}
/* Modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.mo.h{display:none}
.mc2{background:#fff;border-radius:10px;padding:24px;width:380px;max-width:92vw}
.mt{font-size:16px;font-weight:700;margin-bottom:16px}
.ma{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.bcl{padding:8px 16px;border:1px solid var(--bd);background:#fff;border-radius:5px;font-size:13px;cursor:pointer}
.bok{padding:8px 16px;background:var(--p);color:#fff;border:none;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer}
.bok:hover{background:#6D28D9}
/* Factory */
.fy-cnt{padding:20px 24px;flex:1;overflow-y:auto}
.fy-sec{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);padding:16px;margin-bottom:16px}
.fy-sec h4{font-size:13px;font-weight:600;color:var(--t3);margin-bottom:12px}
.fy-step{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);margin-bottom:10px;overflow:hidden}
.fy-step-h{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
.fy-step-h:hover{background:#fafafa}
.fy-step-n{width:24px;height:24px;border-radius:50%;background:#cbd5e1;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.fy-step.open .fy-step-n{background:#7C3AED}
.fy-step-t{font-weight:600;font-size:14px}
.fy-sum{margin-left:auto;font-size:12px;color:var(--t3);text-align:right}
.fy-chev{color:var(--t4);transition:transform .15s;flex:none}
.fy-step.open .fy-chev{transform:rotate(180deg)}
.fy-step-b{display:none;padding:14px 16px 16px;border-top:1px solid var(--bd)}
.fy-step.open .fy-step-b{display:block}
.fy-hint{font-size:11px;color:var(--t4);margin-top:8px;line-height:1.55}
.fy-nextb{background:#F5F3FF;border:1px solid #DDD6FE;color:#5B21B6;border-radius:var(--rad);padding:11px 14px;font-size:13px;margin-bottom:12px;cursor:pointer}
.fy-nextb:hover{background:#EDE9FE}
.fy-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fy-row .fg{margin-bottom:0;flex:1;min-width:140px}
.modgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.modcol h5{font-size:11px;font-weight:700;color:var(--t4);letter-spacing:.05em;margin-bottom:8px}
.modit{border:1px solid var(--bdl);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12px;background:#fff}
.modit .lbl{font-weight:700;font-size:13px;margin-right:6px}
.modit .meta{color:var(--t3);font-size:11px;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modit .ov{color:var(--t2);font-size:11px;margin-top:3px;font-style:italic}
.qwrap{display:flex;gap:10px;flex-wrap:wrap}
.qcard{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;min-width:180px;flex:1;max-width:240px;background:var(--bg)}
.qcard .nm{font-weight:700;font-size:13px;margin-bottom:4px}
.scorep{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.fy-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fy-chip{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:500;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;gap:6px}
/* Guiones — acordeón por persona */
.gp{border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;overflow:hidden;background:#fff}
.gp-h{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:#FAFAF9;user-select:none}
.gp-h:hover{background:#F3F4F6}
.gp-h .nm{font-weight:600;font-size:13.5px}
.gp-h .ct{font-size:12px;color:var(--t3);font-weight:400}
.gp-h .sp{margin-left:auto;display:flex;gap:12px;align-items:center}
.gp-b{display:none;padding:12px 14px 14px}
.gp.open .gp-b{display:block}
.gp-cv{color:var(--t4);transition:transform .15s;font-size:11px}
.gp.open .gp-cv{transform:rotate(180deg)}
.gp-coll{font-size:12px;color:var(--p);margin:10px 0 4px;cursor:pointer;user-select:none}
.psel{background:#fff;border:1px solid var(--bd);border-radius:var(--rad);padding:12px 16px;margin-bottom:16px}
.psel-l{font-size:11px;font-weight:600;color:var(--t4);letter-spacing:.04em;margin-bottom:9px}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.psel .ptabs{margin:0}
.ptab{display:flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid var(--bd);border-radius:20px;background:#fff;cursor:pointer;font-size:12.5px;color:var(--t2);transition:all .12s;white-space:nowrap}
.ptab:hover{border-color:var(--p);color:var(--p)}
.ptab.active{background:var(--p);border-color:var(--p);color:#fff}
.ptab .b{font-size:11px;opacity:.85;font-weight:600}
.pblock-hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pblock-hd .nm{font-weight:600;font-size:14px}
.pdetail{font-size:11.5px;color:var(--t3);background:var(--bg);border-radius:6px;padding:8px 11px;margin-bottom:12px;line-height:1.55}
.sc-card{border:1px solid var(--bd);border-left:3px solid var(--bd);border-radius:7px;padding:10px 12px;margin-bottom:9px;background:#fff;transition:box-shadow .15s}
.sc-card:hover{box-shadow:0 1px 5px rgba(0,0,0,.07)}
.sc-card.rec{opacity:.55}
.sc-card.h{border-left-color:#7C3AED}.sc-card.b{border-left-color:#3B82F6}.sc-card.c{border-left-color:#F59E0B}
.sc-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.sc-ang{font-weight:600;font-size:12.5px;color:var(--t2)}
.sc-dur{font-size:11px;color:var(--t4);margin-left:auto;white-space:nowrap}
.sc-txt{font-size:13px;line-height:1.55;color:var(--t)}
.sc-ov{display:inline-block;margin-top:7px;font-size:11px;color:var(--p);background:var(--pl);padding:3px 9px;border-radius:5px}
.sc-act{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.sc-act button{font-size:11px;padding:3px 10px;border:1px solid var(--bd);background:#fff;border-radius:5px;cursor:pointer;color:var(--t3)}
.sc-act button:hover{background:var(--bg);color:var(--t)}
.sc-act button.done{border-color:var(--g);color:var(--g)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="sb-hdr"><div class="sb-title">Creator Intelligence</div><div class="sb-sub">TikTok Shop · Fábrica de creativos</div></div>
  <button class="sb-ig" style="background:var(--o);margin-top:0;margin-bottom:14px" onclick="showFactory()">🎬 Fábrica de creativos</button>
  <div class="sb-sec"><span class="sb-lbl">CREADORES</span><div id="cl"></div></div>
  <button class="sb-add" onclick="openModal('c')">+ Agregar creador</button>
  <div class="sb-sec" style="margin-top:8px"><span class="sb-lbl">PRODUCTOS (KALODATA)</span><div id="pl"></div></div>
  <button class="sb-add" onclick="openModal('p')">+ Buscar producto</button>
  <button class="sb-ig" onclick="showInsights()">Insights globales</button>
</aside>
<main id="main">
  <div class="view active" id="view-welcome"><div class="welcome"><div class="welcome-ico">✦</div><h2>Creator Intelligence</h2><p>Agrega un creador o busca un producto para comenzar</p></div></div>
  <div class="view" id="view-creator">
    <div id="cr-banner"></div>
    <div class="cr-hdr" id="cr-hdr"></div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="adn" onclick="switchTab('adn')">ADN del creador</div>
      <div class="tab" data-tab="videos" onclick="switchTab('videos')">Videos</div>
      <div class="tab" data-tab="script" onclick="switchTab('script')">Generar script</div>
    </div>
    <div class="tc" id="tc"></div>
  </div>
  <div class="view" id="view-product"><div class="ph" id="ph"></div><div class="pv-area" id="pva"></div></div>
  <div class="view" id="view-insights"><div class="ins-cnt" id="ic"><div class="empty"><div class="spin"></div></div></div></div>
  <div class="view" id="view-factory"><div class="fy-cnt"><div id="fy-form"></div><div id="fy-lists"></div></div></div>
</main>
<div class="mo h" id="mo" onclick="closeMo(event)">
  <div class="mc2" onclick="event.stopPropagation()">
    <div class="mt" id="mo-t"></div>
    <div id="mo-b"></div>
    <div class="ma"><button class="bcl" onclick="closeMo()">Cancelar</button><button class="bok" id="mo-ok">OK</button></div>
  </div>
</div>
<script>
/* ── State ── */
const S={
  creators:[],products:[],
  cid:null,pid:null,
  view:'welcome',tab:'adn',
  det:null,pdet:null,
  vids:{list:[],total:0,page:1,sort:'views',pp:10},
  scripts:[],gen:false,
  form:{name:'',benefit:'',mode:'multicreador',cids:[],pids:[],qty:3,imgf:null,imgu:null},
  polls:{}
};

/* ── Utils ── */
const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtN(n){n=Number(n)||0;if(n>=1e6)return(n/1e6).toFixed(1).replace('.0','')+'M';if(n>=1e3)return Math.round(n/1e3)+'K';return String(n);}
function fmtD(ts){if(!ts)return'—';const d=new Date(ts.includes('T')?ts:ts+' UTC');const s=Math.round((Date.now()-d)/1000);if(s<60)return'hace un momento';if(s<3600)return`hace ${Math.round(s/60)}m`;if(s<86400)return`hace ${Math.round(s/3600)}h`;return`hace ${Math.round(s/86400)}d`;}
const COLS=['#7C3AED','#059669','#2563EB','#DC2626','#D97706','#0891B2','#DB2777','#9333EA'];
function avcol(i){return COLS[i%COLS.length];}
function inits(n){return String(n||'').slice(0,2).toUpperCase();}
function hkCol(h){const m={'Dato shock':['#EDE9FE','#5B21B6'],'Contraste':['#FFEDD5','#C2410C'],'Directo':['#D1FAE5','#065F46'],'Testimonio':['#DBEAFE','#1E40AF'],'Comparación':['#FEF3C7','#92400E']};return m[h]||['#F3F4F6','#374151'];}
function scCol(l){const m={Hook:'#7C3AED',Dolor:'#EF4444',Descubrimiento:'#3B82F6',Prueba:'#10B981',CTA:'#F59E0B'};return m[l]||'#6B7280';}
function parseDur(t){const m=String(t||'').match(/(\d+)\D+(\d+)/);return m?+m[2]-+m[1]:0;}

/* ── API ── */
async function api(method,path,body){
  const o={method,headers:{}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
  const r=await fetch(path,o);
  if(!r.ok){const e=await r.json().catch(()=>({detail:r.statusText}));throw new Error(e.detail||'Error');}
  return r.json();
}

/* ── Init ── */
async function loadAll(){
  const [creators,products]=await Promise.all([api('GET','/api/creators'),api('GET','/api/products')]);
  S.creators=creators;S.products=products;
  renderSB();
  [...creators,...products].forEach(x=>{
    if(x.status&&!['done','error'].includes(x.status)) startPoll(x.id,!!x.username);
  });
}

/* ── Sidebar ── */
function renderSB(){
  $('cl').innerHTML=S.creators.map((c,i)=>{
    const dc=c.status==='done'?'dg':c.status==='error'?'dr':'da dp';
    const meta=c.status==='done'?`${c.video_count||0} videos`:c.niche||c.status||'...';
    return`<div class="sb-item${S.cid===c.id?' active':''}" onclick="selC(${c.id})">
      <div class="sb-av" style="background:${avcol(i)}">${inits(c.display_name||c.username)}</div>
      <div class="sb-inf"><div class="sb-name">${esc(c.display_name||c.username)}</div>
      <div class="sb-meta"><span class="dot ${dc}"></span>${esc(meta)}</div></div>
      <button class="sb-ref" onclick="event.stopPropagation();refC(${c.id})" title="Actualizar">↻</button>
    </div>`;
  }).join('');
  $('pl').innerHTML=S.products.map((p,i)=>{
    const dc=p.status==='done'?'dg':p.status==='error'?'dr':'da dp';
    const meta=p.status==='done'?`${p.total_videos||0} videos`:p.status||'...';
    return`<div class="sb-item${S.pid===p.id?' active':''}" onclick="selP(${p.id})">
      <div class="sb-av" style="background:${avcol(i+4)}">${inits(p.keyword)}</div>
      <div class="sb-inf"><div class="sb-name">${esc(p.keyword)}</div>
      <div class="sb-meta"><span class="dot ${dc}"></span>${esc(meta)}</div></div>
    </div>`;
  }).join('');
}

/* ── View switching ── */
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(`view-${v}`).classList.add('active');S.view=v;}
function switchTab(t){S.tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));renderTC();}

/* ── Creator ── */
async function selC(id){
  S.cid=id;S.pid=null;S.scripts=[];renderSB();showView('creator');
  try{S.det=await api('GET',`/api/creators/${id}`);renderCrHdr();renderBanner();renderTC();if(!['done','error'].includes(S.det.status))startPoll(id,true);}
  catch(e){$('tc').innerHTML=`<div class="empty"><p style="color:var(--r)">${esc(e.message)}</p></div>`;}
}

function renderCrHdr(){
  const c=S.det;if(!c)return;
  const i=S.creators.findIndex(x=>x.id===c.id);
  $('cr-hdr').innerHTML=`<div class="cr-prof">
    <div class="cr-av-lg" style="background:${avcol(i>=0?i:0)}">${inits(c.display_name||c.username)}</div>
    <div><div class="cr-uname">@${esc(c.username)}</div>
    <div class="badges">
      ${c.niche&&c.niche.length<30?`<span class="badge">${esc(c.niche)}</span>`:''}
      <span class="badge">${c.video_count||0} videos</span>
      ${c.last_scraped?`<span class="badge">Actualizado ${fmtD(c.last_scraped)}</span>`:''}
    </div></div></div>`;
  document.querySelector('[data-tab="videos"]').textContent=`Videos (${c.video_count||0})`;
}

function renderBanner(){
  const c=S.det;const b=$('cr-banner');
  if(!c||['done','error'].includes(c.status)){b.innerHTML='';return;}
  b.innerHTML=`<div class="banner"><div style="display:flex;align-items:center;gap:8px"><div class="spin" style="width:16px;height:16px;border-width:2px"></div><span class="banner-t">${esc(c.niche||c.status||'Analizando...')}</span></div></div>`;
}

function renderTC(){if(!S.det)return;if(S.tab==='adn')renderADN();else if(S.tab==='videos')loadVids();else renderScriptForm();}

/* ── ADN Tab ── */
function renderADN(){
  const c=S.det,a=c.analysis||{};
  const hooks=a.top_hooks||[],angles=a.angles||[],steps=a.formula_steps||[];
  const mg=`<div class="mg">
    <div class="mc"><div class="mc-lbl">Promedio views</div><div class="mc-val">${fmtN(a.avg_views||0)}</div><div class="mc-sub">por video</div></div>
    <div class="mc"><div class="mc-lbl">Videos +1M</div><div class="mc-val">${c.videos_1m||0}</div><div class="mc-sub">de ${c.video_count||0}</div></div>
    <div class="mc"><div class="mc-lbl">Duración top</div><div class="mc-val">${a.avg_duration||'—'}<small style="font-size:13px">s</small></div><div class="mc-sub">promedio</div></div>
    <div class="mc"><div class="mc-lbl">Hook dominante</div><div class="mc-val" style="font-size:15px">${esc(a.dominant_hook||'—')}</div></div>
  </div>`;
  const hh=hooks.map(h=>`<div class="hk-row"><div class="hk-txt">"${esc(h.text)}"</div><div class="hk-bar-w"><div class="hk-bar" style="width:${h.performance_pct||0}%"></div></div><div class="hk-pct">${h.performance_pct||0}% · ${h.count||0} videos</div></div>`).join('');
  const ah=angles.map(a=>`<span class="ang-tag">${esc(a)}</span>`).join('');
  const sh=steps.map((s,i)=>`${i>0?'<span class="farrow">→</span>':''}<span class="fstep" style="background:${s.color||'#6B7280'}">${esc(s.label)}</span>`).join('');
  const dna=hooks.length?`<div class="dna-grid">
    <div class="dna-card"><h4>Hooks más efectivos (por performance)</h4>${hh||'<span style="color:var(--t3)">Sin datos</span>'}</div>
    <div class="dna-card"><h4>Ángulos de producto que convierten</h4><div class="ang-wrap">${ah||'<span style="color:var(--t3)">Sin datos</span>'}</div></div>
  </div>`:'';
  const fml=a.formula?`<div class="formula-box"><div class="formula-lbl">● FÓRMULA DEL CREADOR</div><div class="formula-txt">${esc(a.formula)}</div><div class="formula-steps">${sh}</div></div>`:'';
  const none=!a.formula&&!hooks.length?`<div style="padding:28px;text-align:center;color:var(--t3)">${c.status==='done'?'No hay análisis disponible.':'Análisis en progreso...'}</div>`:'';
  $('tc').innerHTML=mg+dna+fml+none;
}

/* ── Videos Tab ── */
async function loadVids(page){
  page=page||S.vids.page;
  try{
    const d=await api('GET',`/api/creators/${S.cid}/videos?sort=${S.vids.sort}&page=${page}&per_page=${S.vids.pp}`);
    S.vids={...S.vids,...d,list:d.videos,page};renderVids();
  }catch(e){$('tc').innerHTML=`<p style="color:var(--r);padding:20px">${esc(e.message)}</p>`;}
}

function renderVids(){
  const{list,total,page,pp,sort}=S.vids;
  const rows=list.map(v=>{const[bg,fg]=hkCol(v.hook_type);return`<tr>
    <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(v.title)}">${esc((v.title||'').slice(0,42))}${(v.title||'').length>42?'…':''}</td>
    <td style="font-weight:600">${fmtN(v.views)}</td>
    <td><span class="hbadge" style="background:${bg};color:${fg}">${esc(v.hook_type||'—')}</span></td>
    <td style="color:var(--t3)">${esc((v.title||'').split(' ').slice(0,3).join(' '))}</td>
    <td>${v.duration||0}s</td></tr>`;}).join('');
  const shown=Math.min(page*pp,total);
  $('tc').innerHTML=`<div class="vtool">
    <span class="vcount">${total} videos · ordenados por ${sort==='views'?'views':sort==='hook_type'?'hook':'duración'}</span>
    <select class="vsort" onchange="S.vids.sort=this.value;loadVids(1)">
      <option value="views"${sort==='views'?' selected':''}>Ordenar: Views</option>
      <option value="hook_type"${sort==='hook_type'?' selected':''}>Ordenar: Hook type</option>
      <option value="duration"${sort==='duration'?' selected':''}>Ordenar: Duración</option>
    </select></div>
  <table><thead><tr><th>Video</th><th>Views</th><th>Hook</th><th>Producto</th><th>Dur.</th></tr></thead>
  <tbody>${rows||'<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--t3)">Sin videos</td></tr>'}</tbody></table>
  <div class="vfoot"><span>Mostrando ${shown} de ${total}</span>
    ${page>1?`<span class="lnk" onclick="loadVids(${page-1})">← ant</span>`:''}
    ${shown<total?`<span class="lnk" onclick="loadVids(${page+1})">sig →</span>`:''}
    ${total>pp?`<span class="lnk" onclick="S.vids.pp=100;loadVids(1)">ver todos</span>`:''}
  </div>`;
}

/* ── Polling ── */
function startPoll(id,isC){
  const k=`${isC?'c':'p'}_${id}`;if(S.polls[k])return;
  S.polls[k]=setInterval(async()=>{
    try{
      const d=await api('GET',isC?`/api/creators/${id}`:`/api/products/${id}`);
      const done=['done','error'].includes(d.status);
      if(isC){const i=S.creators.findIndex(x=>x.id===id);if(i>=0)S.creators[i]={...S.creators[i],...d};}
      else{const i=S.products.findIndex(x=>x.id===id);if(i>=0)S.products[i]={...S.products[i],...d};}
      renderSB();
      if(isC&&S.cid===id){S.det=d;renderCrHdr();renderBanner();if(done&&S.tab==='adn')renderADN();}
      if(!isC&&S.pid===id){S.pdet=d;renderProd(d);}
      if(done){clearInterval(S.polls[k]);delete S.polls[k];}
    }catch{clearInterval(S.polls[k]);delete S.polls[k];}
  },3000);
}

async function refC(id){
  try{await api('POST',`/api/creators/${id}/refresh`);const i=S.creators.findIndex(c=>c.id===id);if(i>=0)S.creators[i].status='scraping';renderSB();if(S.cid===id)await selC(id);else startPoll(id,true);}
  catch(e){alert(e.message);}
}

/* ── Script Form ── */
function renderScriptForm(){
  const f=S.form;
  if(S.cid&&!f.cids.includes(S.cid))f.cids=[S.cid];
  const cchips=S.creators.map(c=>`<span class="chip${f.cids.includes(c.id)?' sel':''}" onclick="togChip('c',${c.id})">@${esc(c.username)}</span>`).join('');
  const pchips=S.products.map(p=>`<span class="chip${f.pids.includes(p.id)?' sel':''}" onclick="togChip('p',${p.id})">${esc(p.keyword)}</span>`).join('');
  const modes=[['un_creador','Un creador'],['multicreador','Multicreador'],['mejor_de_todos','Mejor de todos']];
  const mh=modes.map(([v,l])=>`<button class="tb${f.mode===v?' active':''}" onclick="setMode('${v}')">${l}</button>`).join('');
  const qh=[3,5,10].map(q=>`<button class="tb${f.qty===q?' active':''}" onclick="S.form.qty=${q};renderScriptForm()">${q}</button>`).join('');
  const formHtml=`<div class="sfp">
    <h4>Datos del producto</h4>
    <div class="fg">
      <div class="upa" onclick="$('uinp').click()">
        <input type="file" id="uinp" accept="image/*" style="display:none" onchange="doUpload(event)">
        ${f.imgu?`<img class="upimg" src="${esc(f.imgu)}">`:`<div style="font-size:22px;margin-bottom:4px">🖼</div><div style="font-size:12px;color:var(--t3)">Subir foto del producto</div>`}
      </div>
    </div>
    <div class="fg"><label class="fl">Nombre del producto *</label>
      <input class="fi" placeholder="ej. Mushroom Coffee" value="${esc(f.name)}" oninput="S.form.name=this.value"></div>
    <div class="fg"><label class="fl">Beneficio principal (opcional)</label>
      <input class="fi" placeholder="ej. energía sin ansiedad" value="${esc(f.benefit)}" oninput="S.form.benefit=this.value"></div>
    <div class="fg"><label class="fl">Modo de generación</label><div class="tg">${mh}</div></div>
    <div class="fg"><label class="fl">Basar en</label><div class="cw">${cchips}${pchips}</div></div>
    <div class="fg"><label class="fl">Cantidad de scripts</label><div class="tg" style="width:140px">${qh}</div></div>
    <button class="gbtn" onclick="doGenerate()" ${S.gen?'disabled':''}>
      ${S.gen?'<span style="display:flex;align-items:center;justify-content:center;gap:8px"><div class="spin" style="width:16px;height:16px;border-width:2px"></div>Generando...</span>':'Generar scripts'}
    </button>
  </div>`;
  const resHtml=`<div class="srp">
    ${S.gen?`<div class="empty"><div class="spin"></div><h3>Generando ${f.qty} scripts...</h3><p>Claude está analizando el ADN</p></div>`:
    S.scripts.length?S.scripts.map((s,i)=>mkCard(s,i)).join(''):
    `<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".3"><path d="M12 3l1.912 5.813a2 2 0 001.272 1.272L21 12l-5.816 1.912a2 2 0 00-1.272 1.272L12 21l-1.912-5.816a2 2 0 00-1.272-1.272L3 12l5.816-1.912a2 2 0 001.272-1.272L12 3z"/></svg><h3>Scripts aparecerán aquí</h3><p>Completa el formulario y haz clic en "Generar scripts"</p></div>`}
  </div>`;
  $('tc').innerHTML=`<div class="sl">${formHtml}${resHtml}</div>`;
}

function togChip(type,id){
  const f=S.form;
  if(type==='c'){if(f.mode==='un_creador')f.cids=[id];else f.cids=f.cids.includes(id)?f.cids.filter(x=>x!==id):[...f.cids,id];}
  else f.pids=f.pids.includes(id)?f.pids.filter(x=>x!==id):[...f.pids,id];
  renderScriptForm();
}
function setMode(m){
  S.form.mode=m;
  if(m==='mejor_de_todos'){S.form.cids=S.creators.map(c=>c.id);S.form.pids=S.products.map(p=>p.id);}
  else if(m==='un_creador'&&S.form.cids.length>1)S.form.cids=[S.form.cids[0]];
  renderScriptForm();
}
async function doUpload(e){
  const file=e.target.files[0];if(!file)return;
  const fd=new FormData();fd.append('file',file);
  try{const r=await fetch('/api/upload',{method:'POST',body:fd});const d=await r.json();S.form.imgf=d.filename;S.form.imgu=d.url;renderScriptForm();}
  catch(err){alert('Error subiendo imagen: '+err.message);}
}
async function doGenerate(){
  const f=S.form;if(!f.name.trim()){alert('Ingresa el nombre del producto');return;}
  S.gen=true;S.scripts=[];renderScriptForm();
  try{const d=await api('POST','/api/scripts/generate',{product_name:f.name,benefit:f.benefit,mode:f.mode,creator_ids:f.cids,product_ids:f.pids,quantity:f.qty,image_filename:f.imgf});S.scripts=d.scripts||[];}
  catch(e){alert('Error: '+e.message);}
  S.gen=false;renderScriptForm();
}

/* ── Script Card ── */
function mkCard(s,i){
  const scenes=s.scenes||[];
  const total=scenes.reduce((sum,sc)=>sum+parseDur(sc.timing),0)||scenes.length*8;
  const tbar=scenes.map(sc=>{const pct=Math.round(parseDur(sc.timing)/total*100);const c=scCol(sc.label);return`<div class="tseg" style="width:${pct}%;background:${c}" title="${esc(sc.label)}">${pct>12?esc(sc.label):''}</div>`;}).join('');
  const scns=scenes.map(sc=>{const c=scCol(sc.label);return`<div class="scene" style="border-left-color:${c}"><div class="sc-hdr">${esc(sc.label)}<span class="sc-time">${esc(sc.timing)}</span></div><div class="sc-scr">${esc(sc.script)}</div><ul class="sc-dir">${(sc.direction||[]).map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`;}).join('');
  const ht=s.hashtags||{};
  const htH=`<div class="ht-sec">
    <div class="ht-row"><span class="ht-lbl">Viral</span><div class="htw">${(ht.viral||[]).map(h=>`<span class="ht htv">${esc(h)}</span>`).join('')}</div></div>
    <div class="ht-row"><span class="ht-lbl">Producto</span><div class="htw">${(ht.product||[]).map(h=>`<span class="ht htp">${esc(h)}</span>`).join('')}</div></div>
    <div class="ht-row"><span class="ht-lbl">Nicho</span><div class="htw">${(ht.niche||[]).map(h=>`<span class="ht htn">${esc(h)}</span>`).join('')}</div></div>
  </div>`;
  return`<div class="scard">
    <div class="scard-hdr">
      <div class="scard-ttl">${esc(s.title)}</div>
      <span class="sdur">${esc(s.duration_estimate)}</span>
      <span class="ssrc">${esc(s.source)}</span>
      <div class="sacts"><button class="abtn" onclick="cpScript(${i})">📋 Copiar</button><button class="abtn" onclick="dlScript(${i})">⬇ .txt</button></div>
    </div>
    <div class="sbody">
      <div class="hook-s">
        <div class="hi"><span class="hl">Visual</span><span class="hv">${esc(s.hook?.visual||'')}</span></div>
        <div class="hi"><span class="hl">Textual</span><span class="hv">${esc(s.hook?.textual||'')}</span></div>
        <div class="hi"><span class="hl">Audio</span><span class="hv">${esc(s.hook?.audio||'')}</span></div>
      </div>
      <div class="tbar">${tbar}</div>
      <div class="scenes">${scns}</div>

/* ── Export ── */
function buildTxt(s){
  const sep='═══════════════════════════════════════';
  const sec=l=>`\n── ${l} ${'─'.repeat(Math.max(0,34-l.length))}\n`;
  let t=`${sep}\n${s.title} · ${S.form.name}\n${s.duration_estimate} · ${s.source}\n${sep}`;
  t+=sec('HOOK');t+=`VISUAL: ${s.hook?.visual||''}\nTEXTUAL: ${s.hook?.textual||''}\nAUDIO: ${s.hook?.audio||''}`;
  t+=sec('SCRIPT');
  (s.scenes||[]).forEach(sc=>{t+=`\n${sc.label} (${sc.timing})\nGUIÓN: ${sc.script}\nDIRECCIÓN:\n`;(sc.direction||[]).forEach(d=>{t+=`  • ${d}\n`;});});
  t+=sec('DESCRIPCIÓN');t+=s.description||'';
  t+=sec('HASHTAGS');const ht=s.hashtags||{};t+=[...(ht.viral||[]),...(ht.product||[]),...(ht.niche||[])].join(' ');
  t+=sec('SEO TEXTO OCULTO');t+='(Pegar al final con texto color fondo)\n'+(s.seo_hidden||[]).join(' ');
  t+=sec('SEO AUDIO (DI EN VOZ ALTA)');t+=(s.seo_audio||[]).join(' · ');
  return t;
}
function cpScript(i){const s=S.scripts[i];if(s)cpTxt(buildTxt(s));}
function dlScript(i){
  const s=S.scripts[i];if(!s)return;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buildTxt(s)],{type:'text/plain'}));
  a.download=`script-${i+1}.txt`;a.click();URL.revokeObjectURL(a.href);
}
function cpTxt(txt,btn){
  navigator.clipboard.writeText(txt).then(()=>{if(btn){const o=btn.textContent;btn.textContent='✓';setTimeout(()=>btn.textContent=o,1500);}}).catch(()=>alert('No se pudo copiar'));
}

    <div id="fy-combos-box" style="margin-top:12px"></div>`;

  const paso4=`
    <div id="fy-queue-box"></div>
    <div class="fy-hint">Publica 4–6 al día: ▶ descarga el video, súbelo en TikTok con el 📋 caption (deja el nombre H#-B#-C# en el caption — así se cruzan las métricas), activa ahí subtítulos y música, y márcalo ✓ publicado para que entre el siguiente a la cola.</div>`;

  const paso5=`
    <div class="fy-row">
      <div class="fg" style="max-width:260px"><input class="fi" type="file" id="fy-csv" accept=".csv,text/csv"></div>
      <button class="abtn" onclick="fyMetrics()">Importar CSV</button>
    </div>
    <div class="fy-hint">El viernes exporta el CSV de videos (Seller Center / TikTok Analytics) e impórtalo: el sistema cruza views y GMV por nombre y te dice qué hook, qué cuerpo y qué CTA ganan — eso define qué replicas la próxima semana.</div>
    <div id="fy-attr-box" style="margin-top:12px"></div>`;

  $('fy-form').innerHTML=`
  <div style="font-size:18px;font-weight:700;margin-bottom:4px">Fábrica de creativos</div>
  <div style="font-size:13px;color:var(--t3);margin-bottom:16px">Tu ciclo semanal en 5 pasos — el banner morado te dice dónde vas</div>
  ${campBar}
  <div id="fy-personabar"></div>
  <div id="fy-next"></div>
  <div id="fy-chips"></div>
  ${fyStepShell(1,'🧠 Guiones por buyer persona',paso1)}
  ${fyStepShell(2,'🎙 Grabar y subir módulos',paso2)}
  ${fyStepShell(3,'⚡ Generar videos',paso3)}
  ${fyStepShell(4,'📤 Publicar la cola de hoy',paso4)}
  ${fyStepShell(5,'📊 Métricas — qué gana',paso5)}`;
  const sel=$('fy-type');if(sel)sel.value=f.type;
  fyApplyOpen();
}

function fyNextStep(){
  const hasAll=['hook','body','cta'].every(t=>F.mods.some(m=>m.type===t&&m.status==='ready'));
  const readyC=F.combos.filter(c=>c.status==='ready').length;
  if(!F.scripts.length&&!F.mods.length)return 1;
  if(!hasAll)return 2;
  if(!readyC)return 3;
  if(F.queue.length)return 4;
  return 5;
}
function fyTog(n){F.manual=(F.manual===n?-1:n);fyApplyOpen();}
function fyApplyOpen(){
  const open=F.manual==null?fyNextStep():F.manual;
  for(let i=1;i<=5;i++){const e=$('fy-st-'+i);if(e)e.classList.toggle('open',i===open);}
}

async function fyAddResearch(){
  if(!F.camp){alert('Crea o selecciona una campaña primero');return;}
  const ta=$('fy-rl');
  const urls=(ta?.value||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!urls.length){alert('Pega al menos un link de TikTok');return;}
  try{
    await api('POST','/api/factory/research',{campaign_id:F.camp,urls});
    ta.value='';await loadFactory();
  }catch(e){alert(e.message);}
}
async function fyPasteTranscript(){
  const txt=prompt('Pega la transcripción del video ganador:');
  if(!txt||!txt.trim())return;
  try{await api('POST','/api/factory/research',{campaign_id:F.camp,urls:[],transcript:txt});await loadFactory();}
  catch(e){alert(e.message);}
}
async function fyDelResearch(id){
  try{await api('DELETE','/api/factory/research/'+id);await loadFactory();}
  catch(e){alert(e.message);}
}
async function fyRetryResearch(url){
  if(!url)return;
  try{await api('POST','/api/factory/research',{campaign_id:F.camp,urls:[url]});await loadFactory();}
  catch(e){alert(e.message);}
}
async function fyShowTr(id){
  if(F.trOpen===id){F.trOpen=null;renderFyStudio();return;}
  F.trOpen=id;
  if(!F.trs[id]){
    try{const d=await api('GET','/api/factory/research/'+id);F.trs[id]=(d.transcript||'').trim()||'(transcripción vacía)';}
    catch(e){F.trs[id]='Error: '+e.message;}
  }
  renderFyStudio();
}
async function fyUploadPhoto(e){
  const file=e.target.files[0];if(!file)return;
  const fd=new FormData();fd.append('file',file);
  const brief=$('fy-brief')?.value||'';
  try{
    const r=await fetch('/api/upload',{method:'POST',body:fd});
    const d=await r.json();if(!r.ok)throw new Error(d.detail||'Error');
    // persistir como foto activa de la campaña (se añade a la galería)
    await api('PATCH','/api/factory/campaigns/'+F.camp,{product_image:d.filename});
    await loadCamps();renderFyForm();await loadFactory();
    const bi=$('fy-brief');if(bi)bi.value=brief;
  }catch(err){alert('Error subiendo foto: '+err.message);}
}
function fyToggleAdv(){
  F.advOpen=!F.advOpen;
  const e=$('fy-adv');if(e)e.style.display=F.advOpen?'block':'none';
  const l=$('fy-advlnk');if(l)l.textContent=(F.advOpen?'▾':'▸')+' añadir videos ganadores como contexto (opcional)';
}
async function fyResearchPersonas(){
  if(!F.camp)return;
  if(!F.prodImg){alert('Sube la foto del producto primero');return;}

}
function fyUsePersona(name){const bi=$('fy-brief');if(bi){bi.value=name;bi.focus();}}
async function fyUsePersonaGen(name){const bi=$('fy-brief');if(bi)bi.value=name;await fyGenScripts();}
function fyTab(key){F.activePersona=key;renderFyStudio();}

async function fyRemovePersona(name){

  try{await api('POST','/api/factory/personas/remove',{campaign_id:F.camp,persona:name});await loadFactory();}

async function fyGenScripts(){
  if(!F.camp)return;
  const hasVids=F.research.filter(r=>r.status==='done').length;
  if(!F.prodImg&&!hasVids){alert('Sube la foto del producto para generar guiones');return;}
  const brief=($('fy-brief')?.value||'').trim();

    await api('POST','/api/factory/scripts/generate',{campaign_id:F.camp,product_name:F.prod,brief,image_filename:F.prodImg||''});
    await loadFactory();
    if(F.personas.length){F.activePersona=F.personas[F.personas.length-1].name;renderFyStudio();}

  try{await api('PATCH','/api/factory/scripts/'+id,{status:st});await loadFactory();}
  catch(e){alert(e.message);}
}

async function fyUpload(){
  if(!F.camp){alert('Crea o selecciona una campaña primero');return;}
  const inp=$('fy-file');const files=[...(inp?.files||[])];
  if(!files.length){alert('Elige al menos un video');return;}
  if(F.upBusy)return;F.upBusy=true;
  const btn=$('fy-up');btn.disabled=true;btn.textContent='Subiendo...';
  try{
    for(const file of files){
      const fd=new FormData();
      fd.append('file',file);fd.append('type',F.form.type);fd.append('campaign_id',F.camp);
      fd.append('tags',F.form.tags);fd.append('overlay_text',F.form.overlay);
      fd.append('script_id',F.form.script||'');
      const r=await fetch('/api/factory/modules',{method:'POST',body:fd});
      if(!r.ok){const e=await r.json().catch(()=>({detail:r.statusText}));throw new Error(e.detail);}
    }
    inp.value='';F.form.overlay='';$('fy-ov').value='';F.form.script='';
    await loadFactory();
  }catch(e){alert('Error: '+e.message);}
  F.upBusy=false;btn.disabled=false;btn.textContent='Subir';
}

function fyStats(){
  const m=F.status.modules||{},c=F.status.combos||{};
  const busy=F.status.pipeline_running||F.status.combos_running;
  const chips=[];
  const readyM=m.ready||0,totM=Object.values(m).reduce((a,b)=>a+b,0);
  const readyC=c.ready||0;
  chips.push(`<span class="fy-chip"><b>${readyM}</b>/${totM} módulos listos</span>`);
  chips.push(`<span class="fy-chip"><b>${readyC}</b> videos generados</span>`);
  if(m.error)chips.push(`<span class="fy-chip" style="color:var(--r)">${m.error} con error</span>`);
  if(busy)chips.push(`<span class="fy-chip"><div class="spin" style="width:12px;height:12px;border-width:2px"></div>${F.status.combos_running?'Generando combinaciones...':'Procesando módulos...'}</span>`);
  if(F.status.research_running)chips.push(`<span class="fy-chip"><div class="spin" style="width:12px;height:12px;border-width:2px"></div>Transcribiendo videos ganadores...</span>`);
  if(F.status.scripts_generating)chips.push(`<span class="fy-chip"><div class="spin" style="width:12px;height:12px;border-width:2px"></div>Escribiendo guiones...</span>`);
  if(F.status.personas_researching)chips.push(`<span class="fy-chip"><div class="spin" style="width:12px;height:12px;border-width:2px"></div>🔍 Investigando buyer personas (web)...</span>`);
  if(F.status.api_key_present===false)chips.push(`<span class="fy-chip" style="color:#fff;background:var(--r);border-color:var(--r)">⛔ Falta ANTHROPIC_API_KEY en el archivo .env — sin ella no hay edición IA, scores, captions ni guiones. Agrégala y reinicia la app.</span>`);
  if(F.status.edits_running)chips.push(`<span class="fy-chip"><div class="spin" style="width:12px;height:12px;border-width:2px"></div>✂ La IA está editando módulos (silencios, repeticiones, duración)...</span>`);
  if(F.status.edit_note)chips.push(`<span class="fy-chip" style="color:#B45309;border-color:#FCD34D;background:#FFFBEB">✂ ${esc(F.status.edit_note)}</span>`);
  if(F.status.combos_note&&!busy)chips.push(`<span class="fy-chip" style="color:#B45309;border-color:#FCD34D;background:#FFFBEB">⚠ ${esc(F.status.combos_note)}</span>`);
  return`<div class="fy-stats">${chips.join('')}</div>`;
}

const RS_ST={pending:'en cola',downloading:'descargando',transcribing:'transcribiendo',done:'✓ listo',error:'error'};

function renderFyStudio(){
  const rl=$('fy-research'),an=$('fy-angles'),sc=$('fy-scripts'),sel=$('fy-script'),gb=$('fy-gensc');
  if(!rl)return;
  const rb=$('fy-research-btn');
  if(rb){const busy=F.status.personas_researching;rb.disabled=busy;rb.textContent=busy?'🔍 Investigando...':'🔍 Investigar buyer persona';}
  const pc=$('fy-personacands');
  if(pc){
    const err=F.status.personas_error?`<div style="font-size:12px;color:var(--r);margin-top:8px">No se pudo investigar: ${esc(F.status.personas_error)} <span class="lnk" onclick="fyResearchPersonas()">reintentar</span></div>`:'';
    pc.innerHTML=err+(F.personaCandidates.length?`<div style="margin-top:12px"><h5 style="font-size:11px;color:var(--t4);margin-bottom:6px">BUYER PERSONAS SUGERIDOS (de voces reales) — elige uno y genera</h5>
      <div class="modgrid">${F.personaCandidates.map(p=>`<div class="modit">
        <span class="lbl">👤 ${esc(p.name||'')}</span>
        ${p.pain?`<div style="font-size:12px;margin:3px 0"><b>dolor:</b> ${esc(p.pain)}</div>`:''}
        ${p.desire?`<div style="font-size:12px"><b>desea:</b> ${esc(p.desire)}</div>`:''}
        ${p.objection?`<div style="font-size:12px"><b>objeción:</b> ${esc(p.objection)}</div>`:''}
        ${p.evidence?`<div class="ov">${esc(p.evidence)}</div>`:''}
        <div class="meta"><span class="lnk" onclick='fyUsePersonaGen(${JSON.stringify(p.name||"")})'>✨ Usar y generar</span> · <span class="lnk" onclick='fyUsePersona(${JSON.stringify(p.name||"")})'>solo elegir</span></div>
      </div>`).join('')}</div></div>`:'');
  }
  rl.innerHTML=(F.research.map(r=>{
    const col=r.status==='done'?'var(--g,#10B981)':r.status==='error'?'var(--r)':'var(--t3)';
    const tr=F.trOpen===r.id?`<div style="font-size:12px;color:#333;background:#fafafa;border:1px solid var(--bd);border-radius:8px;padding:10px;margin:4px 0 8px;white-space:pre-wrap">${esc(F.trs[r.id]||'cargando...')}
      <div style="margin-top:6px"><span class="lnk" onclick='cpTxt(${JSON.stringify(F.trs[r.id]||"")},this)'>📋 copiar transcripción</span></div></div>`:'';
    return`<div style="display:flex;gap:8px;align-items:center;font-size:12px;padding:3px 0">
      <span style="color:${col};font-weight:600;min-width:92px">${RS_ST[r.status]||r.status}</span>
      <span style="color:var(--t3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.url||'transcripción pegada a mano')}</span>
      ${r.status==='done'?`<span class="lnk" onclick="fyShowTr(${r.id})">${F.trOpen===r.id?'ocultar':'ver transcripción'}</span>`:''}
      ${r.status==='error'?`<span style="color:var(--r);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.error)}">${esc((r.error||'').slice(0,80))}</span> <span class="lnk" onclick='fyRetryResearch(${JSON.stringify(r.url||"")})'>↻ reintentar</span>`:''}
      <span class="lnk" style="color:var(--r)" onclick="fyDelResearch(${r.id})">✕</span></div>${tr}`;
  }).join('')||'')+`<div style="margin-top:4px"><span class="lnk" onclick="fyPasteTranscript()">＋ pegar transcripción a mano</span></div>`;
  if(gb){
    if(F.status.scripts_generating){gb.disabled=true;gb.textContent='Escribiendo guiones...';}
    else{gb.disabled=false;gb.textContent='✨ Generar guiones';}
  }
  const pmap={};(F.personas||[]).forEach(p=>{if(p&&p.name)pmap[p.name]=p;});
  if(an){
    const err=F.status.scripts_error?`<div style="font-size:12px;color:var(--r);margin-top:8px">Error al generar: ${esc(F.status.scripts_error)} <span class="lnk" onclick="fyGenScripts()">reintentar</span></div>`:'';
    const am=F.angles.length?`<div class="gp-coll" onclick="fyCtxTog()">${F.ctxOpen?'▾':'▸'} mapa de ángulos (${F.angles.length})</div>${F.ctxOpen?`<div style="margin-bottom:4px">${F.angles.map(a=>`<div style="font-size:12px;padding:5px 0;border-bottom:1px solid var(--bdl)"><b>${esc(a.angle||'')}</b>${a.evidence?` — <span style="color:var(--t3)">${esc(a.evidence)}</span>`:''}${a.hook_formula?`<div style="color:var(--t4);font-style:italic;margin-top:2px">${esc(a.hook_formula)}</div>`:''}</div>`).join('')}</div>`:''}`:'';
    an.innerHTML=err+am;
  }
  const vis=F.scripts.filter(s=>s.status!=='discarded');
  if(sc){
    const scriptCard=s=>{
      const cls=s.type==='hook'?'h':s.type==='body'?'b':'c';
      return`<div class="sc-card ${cls}${s.status==='recorded'?' rec':''}">
        <div class="sc-top"><span class="sc-ang">${esc(s.angle||'—')}</span><span class="sc-dur">~${(s.est_seconds||0).toFixed(0)}s</span></div>
        <div class="sc-txt">${esc(s.text)}</div>
        ${s.overlay_text?`<div class="sc-ov">“${esc(s.overlay_text)}”</div>`:''}
        <div class="sc-act"><button onclick='cpTxt(${JSON.stringify(s.text)},this)'>📋 copiar</button>${s.status==='pending'?`<button class="done" onclick="fyScriptSt(${s.id},'recorded')">✓ grabado</button><button onclick="fyScriptSt(${s.id},'discarded')">descartar</button>`:`<button onclick="fyScriptSt(${s.id},'pending')">↩ pendiente</button>`}</div>
      </div>`;};
    const grid=items=>`<div class="modgrid">${['hook','body','cta'].map(t=>{
      const its=items.filter(s=>s.type===t);
      return`<div class="modcol"><h5>${TYPE_ES[t].toUpperCase()}S (${its.length})</h5>${its.map(scriptCard).join('')||'<div style="color:var(--t4);font-size:12px">—</div>'}</div>`;}).join('')}</div>`;
    const pdetail=p=>p&&(p.pain||p.desire||p.objection)?`<div class="pdetail">${p.pain?`<b>dolor:</b> ${esc(p.pain)}`:''}${p.desire?` · <b>desea:</b> ${esc(p.desire)}`:''}${p.objection?` · <i>objeción: ${esc(p.objection)}</i>`:''}</div>`:'';
    const names=[...new Set([...F.personas.map(p=>p.name||''),...vis.map(s=>s.persona||'')])].filter(Boolean);
    const groups=names.map(n=>({key:n,label:n,items:vis.filter(s=>(s.persona||'')===n),persona:pmap[n]})).filter(g=>g.items.length);
    const generic=vis.filter(s=>!(s.persona||''));
    const tabs=groups.slice();
    if(generic.length)tabs.push({key:'__generic__',label:'Genéricos',items:generic,persona:null,generic:true});
    const pb=$('fy-personabar');
    if(!tabs.length){sc.innerHTML='';if(pb)pb.innerHTML='';}
    else{
      if(!tabs.find(t=>t.key===F.activePersona))F.activePersona=tabs[tabs.length-1].key;
      const active=tabs.find(t=>t.key===F.activePersona);
      const short=s=>{const w=String(s||'').split(/[\s,]+/).filter(Boolean);return (w.slice(0,2).join(' ')||s).slice(0,22);};
      // Barra de personas al TOPE (sub-proyectos del producto)
      if(pb)pb.innerHTML=`<div class="psel"><div class="psel-l">Buyer personas de este producto · trabajas una a la vez</div><div class="ptabs">${tabs.map(t=>{
        const rec=t.items.filter(x=>x.status==='recorded').length;
        return`<div class="ptab${t.key===F.activePersona?' active':''}" title="${esc(t.generic?'Genéricos (combinan con todas)':t.label)}" onclick='fyTab(${JSON.stringify(t.key)})'>${t.generic?'🌐':'👤'} ${esc(t.generic?'Genéricos':short(t.label))} <span class="b">${rec}/${t.items.length}</span></div>`;}).join('')}</div></div>`;
      const rec=active.items.filter(s=>s.status==='recorded').length;
      const hd=`<div class="pblock-hd"><span class="nm">${active.generic?'🌐 Genéricos':'👤 '+esc(active.label)}</span><span style="font-size:12px;color:var(--t3)">${rec}/${active.items.length} grabados</span>${active.generic?'':`<span class="lnk" style="color:var(--r);font-size:11px;margin-left:auto" onclick='fyRemovePersona(${JSON.stringify(active.label)})'>✕ quitar esta persona</span>`}</div>`;
      sc.innerHTML=`<div style="margin-top:12px"><h5 style="font-size:11px;color:var(--t4);margin-bottom:6px">GUIONES PARA GRABAR (voz en off) — persona activa: <b>${active.generic?'Genéricos':esc(short(active.label))}</b> (cámbiala en las pestañas de arriba)</h5>${hd}${active.generic?'':pdetail(active.persona)}${grid(active.items)}</div>`;
    }
  }
  if(sel){
    const opts=F.scripts.filter(s=>s.type===F.form.type&&s.status==='pending');
    const cur=F.form.script;
    sel.innerHTML=`<option value="">— sin guion —</option>`+opts.map(s=>`<option value="${s.id}"${String(s.id)===String(cur)?' selected':''}>${esc((s.persona?'['+s.persona.slice(0,16)+'] ':'')+(s.angle||'guion')+': '+s.text.slice(0,36))}…</option>`).join('');
  }
}

function renderFyLists(){
  if(!F.camp){$('fy-lists').innerHTML='';return;}
  if(!$('fy-st-1'))return; // el formulario aún no está montado
  $('fy-lists').innerHTML='';
  $('fy-chips').innerHTML=fyStats();
  renderFyStudio();

  // Paso 2 · módulos subidos
  const byType={hook:[],body:[],cta:[]};
  F.mods.forEach(m=>{(byType[m.type]||[]).push(m);});
  const cols=['hook','body','cta'].map(t=>`<div class="modcol"><h5>${TYPE_ES[t].toUpperCase()}S (${byType[t].length})</h5>${byType[t].map(fyModItem).join('')||'<div style="color:var(--t4);font-size:12px">Sin módulos</div>'}</div>`).join('');
  $('fy-mods-box').innerHTML=F.mods.length?`<div class="modgrid">${cols}</div>`:'';

  // Paso 3 · videos generados
  const rows=F.combos.map(c=>{
    const[bg,fg]=scoreCol(c.score);
    return`<tr>
    <td style="font-weight:600">${esc(c.name)}</td>
    <td>${(c.duration||0).toFixed(0)}s</td>
    <td><span class="scorep" style="background:${bg};color:${fg}">${c.score!=null?Math.round(c.score):'—'}</span></td>
    <td style="max-width:230px;font-size:12px;color:var(--t3)" title="${esc(c.score_reason||'')}">${esc((c.score_reason||'').slice(0,70))}</td>
    <td>${c.views!=null?fmtN(c.views):'—'}</td>
    <td>${c.gmv!=null?'$'+fmtN(c.gmv):'—'}</td>
    <td>${c.published_at?'✓':''}</td>
    <td style="white-space:nowrap">${c.output_path?`<a class="lnk" href="${furl(c.output_path)}" target="_blank">ver</a> · `:''}<span class="lnk" onclick='cpTxt(${JSON.stringify(c.caption||"")},this)'>caption</span>${c.published_at?'':` · <span class="lnk" onclick="fyPub(${c.id})">publicado</span>`}</td>
  </tr>`;}).join('');
  $('fy-combos-box').innerHTML=F.combos.length?`<table><thead><tr><th>Video</th><th>Dur</th><th>Score</th><th>Razón</th><th>Views</th><th>GMV</th><th>Pub</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:'<div style="color:var(--t4);font-size:13px">Aún no hay videos. Cuando tus módulos estén listos, presiona ⚡ Generar combinaciones.</div>';

  // Paso 4 · cola de hoy
  $('fy-queue-box').innerHTML=F.queue.length?`<div class="qwrap">${F.queue.map(q=>{
    const[bg,fg]=scoreCol(q.score);
    return`<div class="qcard"><div class="nm">${esc(q.name)} <span class="scorep" style="background:${bg};color:${fg}">${q.score!=null?Math.round(q.score):'—'}</span></div>
    <div style="font-size:11px;color:var(--t3);margin-bottom:6px">${(q.duration||0).toFixed(0)}s</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <a class="abtn" href="${furl(q.output_path)}" target="_blank" style="text-decoration:none">▶ Ver</a>
      <button class="abtn" onclick='cpTxt(${JSON.stringify(q.caption||"")},this)'>📋 Caption</button>
      <button class="abtn" onclick="fyPub(${q.id})">✓ Publicado</button>
    </div></div>`;}).join('')}</div>`:'<div style="color:var(--t4);font-size:13px">Nada pendiente de publicar — genera videos en el paso 3.</div>';

  // Paso 5 · atribución
  const attrRows=t=>F.attr.filter(a=>a.type===t&&a.videos_with_metrics>0).map(a=>`<tr>
    <td style="font-weight:600">${esc(a.label)}</td>
    <td style="font-size:12px" title="${esc(a.snippet)}">${esc(a.overlay_text||a.snippet||'')}</td>
    <td>${a.videos_with_metrics}</td><td>${a.avg_views!=null?fmtN(a.avg_views):'—'}</td>
    <td>${a.avg_gmv!=null?'$'+fmtN(a.avg_gmv):'—'}</td></tr>`).join('');
  const hasMetrics=F.attr.some(a=>a.videos_with_metrics>0);
  $('fy-attr-box').innerHTML=hasMetrics?`<div class="modgrid">${['hook','body','cta'].map(t=>`<div><h5 style="font-size:11px;color:var(--t4);margin-bottom:6px">${TYPE_ES[t].toUpperCase()}S</h5><table><thead><tr><th></th><th>Texto</th><th>n</th><th>Views</th><th>GMV</th></tr></thead><tbody>${attrRows(t)||''}</tbody></table></div>`).join('')}</div>`:'';

  fySummaries(hasMetrics);
  fyApplyOpen();
}

function fySummaries(hasMetrics){
  const pend=F.scripts.filter(s=>s.status==='pending').length;
  const rec=F.scripts.filter(s=>s.status==='recorded').length;
  const sum1=F.scripts.length?`${pend} por grabar · ${rec} grabados`
    :(F.prodImg?'foto lista — genera los guiones':'sube la foto del producto');
  const readyM=F.mods.filter(m=>m.status==='ready').length;
  const missing=['hook','body','cta'].filter(t=>!F.mods.some(m=>m.type===t&&m.status==='ready'));
  const sum2=F.mods.length?`${readyM}/${F.mods.length} listos${missing.length?' · faltan: '+missing.map(t=>TYPE_ES[t].toLowerCase()+'s').join(', '):''}`:'sin módulos aún';
  const readyC=F.combos.filter(c=>c.status==='ready').length;
  const sum3=readyC?`${readyC} videos`:'pendiente';
  const sum4=F.queue.length?`${F.queue.length} por publicar`:'al día';
  const sum5=hasMetrics?'con métricas':'pendiente del CSV semanal';
  [[1,sum1],[2,sum2],[3,sum3],[4,sum4],[5,sum5]].forEach(([n,s])=>{const e=$('fy-sum-'+n);if(e)e.textContent=s;});

  const nx=fyNextStep();
  const msgs={
    1:'Sube la foto del producto y genera tus guiones (opcional: a quién le hablas o el ángulo)',
    2:missing.length&&F.mods.length?`Graba y sube lo que falta: ${missing.map(t=>TYPE_ES[t].toLowerCase()+'s').join(', ')}`:'Graba los guiones pendientes y súbelos enlazados a su guion',
    3:'Tus módulos están listos — presiona ⚡ Generar combinaciones',
    4:`Publica la cola de hoy (${F.queue.length} video${F.queue.length===1?'':'s'} con caption listo)`,
    5:'Ciclo al día 🎉 — el viernes importa el CSV de métricas para ver qué gana'
  };
  const e=$('fy-next');if(e)e.innerHTML=`<div class="fy-nextb" onclick="fyTog(${nx})">👉 <b>Siguiente:</b> ${msgs[nx]}</div>`;
}

async function fyEditIA(id,label){
  const t=prompt(`Editar ${label} con IA — quita silencios, tomas repetidas y errores.\n\nDuración objetivo en segundos (déjalo vacío para solo limpiar):`,'');
  if(t===null)return;
  const target=t.trim()?parseFloat(t):null;
  if(t.trim()&&(!target||target<3)){alert('Duración inválida');return;}
  try{await api('POST',`/api/factory/modules/${id}/edit`,{target_seconds:target});await loadFactory();}
  catch(e){alert(e.message);}
}

async function fyEditOv(id){
  const m=F.mods.find(x=>x.id===id);if(!m)return;
  const txt=prompt('Texto en pantalla para '+m.label+' (re-renderiza el módulo):',m.overlay_text||'');
  if(txt===null)return;
  try{await api('PATCH',`/api/factory/modules/${id}`,{overlay_text:txt});await loadFactory();}
  catch(e){alert(e.message);}
}
async function fyDelMod(id,label){
  if(!confirm(`¿Borrar ${label}? Se borran también sus combinaciones.`))return;
  try{await api('DELETE',`/api/factory/modules/${id}`);await loadFactory();}
  catch(e){alert(e.message);}
}
async function fyGen(){
  if(!F.camp){alert('Selecciona una campaña');return;}
  try{await api('POST','/api/factory/combos/generate',{campaign_id:F.camp,product_name:F.prod,min_duration:F.minD,max_duration:F.maxD});await loadFactory();}
  catch(e){alert(e.message);}
}
async function fyRerender(){
  if(!F.camp)return;
  if(!confirm('¿Re-renderizar todos los módulos listos con la plantilla actual?\n\nLas combinaciones existentes se borran y al terminar presionas Generar de nuevo.'))return;
  try{await api('POST','/api/factory/rerender',{campaign_id:F.camp});await loadFactory();}
  catch(e){alert(e.message);}
}
async function fyClear(){
  if(!confirm('¿Borrar las combinaciones de esta campaña? (los módulos se conservan)'))return;
  try{await api('DELETE',`/api/factory/combos?campaign_id=${F.camp}`);await loadFactory();}
  catch(e){alert(e.message);}
}
async function fyPub(id){
  try{await api('POST',`/api/factory/combos/${id}/published`);await loadFactory();}
  catch(e){alert(e.message);}
}
async function fyMetrics(){
  const inp=$('fy-csv');const file=inp?.files?.[0];
  if(!file){alert('Elige el CSV exportado');return;}
  const fd=new FormData();fd.append('file',file);
  try{
    const r=await fetch('/api/factory/metrics',{method:'POST',body:fd});
    const d=await r.json();if(!r.ok)throw new Error(d.detail||'Error');
    alert(`Cruzados ${d.matched} videos de ${d.total_rows} filas (columnas: ${(d.columns||[]).join(', ')||'ninguna'})`);
    inp.value='';await loadFactory();
  }catch(e){alert('Error: '+e.message);}
}

/* ── Start ── */
loadAll();
showFactory(); // la fábrica es la página principal

</script>
